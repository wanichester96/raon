<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>raon map</title>

    <!-- Leaflet & Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #030508;
            --primary-red: #ff2a2a;
            --primary-glow: rgba(255, 42, 42, 0.4);
            --cyan-accent: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.3);
            --traffic-green: #10b981;
            --traffic-yellow: #f59e0b;
            --traffic-red: #ef4444;
            --glass-bg: rgba(10, 12, 18, 0.88);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: var(--bg-color);
        }

        /* Dark Sci-Fi Map Tiles Base */
        .dark-tiles .leaflet-tile {
            filter: brightness(0.6) saturate(0.6) contrast(1.2) hue-rotate(190deg) invert(0.92);
        }
        
        .leaflet-container {
            background: var(--bg-color) !important;
            font-family: inherit;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        /* Top Header & Search Bar */
        .top-container {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box-panel {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .search-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 8px 12px;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .search-input-wrapper:focus-within {
            border-color: var(--primary-red);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .search-input-wrapper input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            width: 100%;
            font-weight: 500;
        }

        .search-input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        /* Search Dropdown Results */
        .search-results-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            max-height: 240px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            z-index: 1001;
            padding: 6px;
        }

        .search-results-dropdown.active {
            display: flex;
        }

        .search-item {
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s ease;
            color: #e2e8f0;
        }

        .search-item:hover {
            background: rgba(255, 42, 42, 0.2);
            color: #fff;
        }

        /* Quick Category Shortcuts */
        .shortcuts-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            scrollbar-width: none;
        }
        .shortcuts-row::-webkit-scrollbar { display: none; }

        .chip-btn {
            background: rgba(18, 22, 32, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            white-space: nowrap;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .chip-btn:hover, .chip-btn:active {
            background: rgba(255, 42, 42, 0.25);
            border-color: var(--primary-red);
            color: #fff;
        }

        /* Floating Controls & Voice Bar */
        .header-controls-bar {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .mode-selector {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 3px;
            gap: 3px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 10px;
            border-radius: 9px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .mode-btn.active {
            background: var(--primary-red);
            color: #fff;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        .toggle-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .toggle-chip.active {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--cyan-accent);
            color: var(--cyan-accent);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        .ultron-voice-btn {
            background: rgba(255, 42, 42, 0.15);
            border: 1px solid var(--primary-red);
            color: var(--primary-red);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            position: relative;
        }

        .ultron-voice-btn.active {
            background: var(--primary-red);
            color: #fff;
            box-shadow: 0 0 14px var(--primary-glow);
        }

        .ultron-voice-btn.speaking {
            animation: voicePulse 0.8s infinite alternate;
        }

        @keyframes voicePulse {
            0% { box-shadow: 0 0 8px var(--primary-red); transform: scale(1); }
            100% { box-shadow: 0 0 22px var(--primary-red); transform: scale(1.04); }
        }

        /* Maneuver Turn Banner */
        .turn-banner {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 130px);
            left: 12px;
            right: 12px;
            z-index: 999;
            padding: 12px 16px;
            display: none;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, rgba(20, 8, 12, 0.95), rgba(8, 12, 22, 0.95));
            border: 1px solid var(--primary-red);
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .turn-banner.active { display: flex; }

        .turn-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 42, 42, 0.2);
            border: 1px solid var(--primary-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--primary-red);
        }

        .turn-details { flex: 1; min-width: 0; }
        .turn-instruction { font-size: 14px; font-weight: 700; color: #fff; }
        .turn-distance { font-size: 12px; color: var(--primary-red); font-weight: 600; margin-top: 2px; }

        /* Speedometer Badge */
        .speed-badge {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 210px);
            left: 14px;
            z-index: 999;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(255, 42, 42, 0.3);
        }
        .speed-value { font-size: 18px; color: var(--primary-red); }

        /* Side Controls */
        .side-controls {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 210px);
            right: 14px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .icon-circle-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(10, 12, 18, 0.85);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .icon-circle-btn:hover {
            background: rgba(255, 42, 42, 0.3);
            border-color: var(--primary-red);
        }

        /* Route Selection Options Sheet */
        .route-selection-panel {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
            left: 12px;
            right: 12px;
            z-index: 1000;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .route-selection-panel.active { display: flex; }

        .route-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .route-card:hover, .route-card.selected {
            background: rgba(255, 42, 42, 0.18);
            border-color: var(--primary-red);
            box-shadow: 0 0 12px rgba(255, 42, 42, 0.3);
        }

        .route-card-title {
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .route-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-toll { background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; color: #f59e0b; }
        .badge-free { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; }

        .route-card-sub {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 3px;
        }

        /* Bottom Action Bar */
        .bottom-bar {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
            left: 12px;
            right: 12px;
            z-index: 1000;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .btn {
            border: none;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            border: 1px solid rgba(255, 42, 42, 0.5);
            box-shadow: 0 6px 18px var(--primary-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        /* Marker Styles */
        .user-location-marker { position: relative; width: 28px; height: 28px; }
        .user-dot {
            width: 18px; height: 18px;
            background: var(--cyan-accent);
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--cyan-accent);
            position: absolute; top: 5px; left: 5px; z-index: 2;
        }
        .user-pulse {
            width: 38px; height: 38px;
            background: var(--cyan-glow);
            border-radius: 50%;
            position: absolute; top: -5px; left: -5px;
            animation: pulse-ring 2s infinite ease-out;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.3); opacity: 0.9; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .dest-pin-icon {
            font-size: 32px;
            color: var(--primary-red);
            filter: drop-shadow(0 0 8px var(--primary-red));
        }

        .leaflet-routing-container { display: none !important; }

        /* Toast Message */
        .toast-msg {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 12, 18, 0.95);
            border: 1px solid var(--primary-red);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px var(--primary-glow);
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(10px); }
    </style>
</head>
<body class="dark-tiles">

    <!-- Toast Notification -->
    <div id="toast" class="toast-msg">Ultron Tactical Navigation Online</div>

    <!-- Top Floating Section -->
    <div class="top-container">
        <!-- Search Box Panel -->
        <div class="glass-panel search-box-panel">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--primary-red);"></i>
                <input type="text" id="searchInput" placeholder="Search destination or target coordinates..." oninput="handleSearchInput(this.value)">
                <i class="fa-solid fa-xmark" id="searchClearBtn" style="cursor: pointer; display: none;" onclick="clearSearchInput()"></i>
            </div>
            
            <!-- Search Dropdown -->
            <div class="glass-panel search-results-dropdown" id="searchResults"></div>
        </div>

        <!-- Quick Category Shortcuts -->
        <div class="shortcuts-row">
            <button class="chip-btn" onclick="searchCategory('Gas Station')"><i class="fa-solid fa-gas-pump" style="color:#f59e0b;"></i> Gas / EV</button>
            <button class="chip-btn" onclick="searchCategory('Parking')"><i class="fa-solid fa-square-p" style="color:#3b82f6;"></i> Parking</button>
            <button class="chip-btn" onclick="searchCategory('Coffee Shop')"><i class="fa-solid fa-mug-hot" style="color:#10b981;"></i> Coffee</button>
            <button class="chip-btn" onclick="searchCategory('Restaurant')"><i class="fa-solid fa-utensils" style="color:#ef4444;"></i> Food</button>
        </div>

        <!-- Mode & Traffic Controls Bar -->
        <div class="glass-panel header-controls-bar">
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="car" onclick="setTravelMode('car')"><i class="fa-solid fa-car"></i> Drive</button>
                <button class="mode-btn" data-mode="bike" onclick="setTravelMode('bike')"><i class="fa-solid fa-bicycle"></i> Bike</button>
                <button class="mode-btn" data-mode="foot" onclick="setTravelMode('foot')"><i class="fa-solid fa-person-walking"></i> Walk</button>
            </div>

            <button class="toggle-chip active" id="trafficToggleBtn" onclick="toggleTrafficOverlay()">
                <i class="fa-solid fa-layer-group"></i> Traffic Layer
            </button>

            <button class="ultron-voice-btn active" id="ultronVoiceBtn" onclick="toggleUltronVoice()">
                <i class="fa-solid fa-robot"></i> Ultron AI
            </button>
        </div>
    </div>

    <!-- Maneuver Turn Banner -->
    <div class="turn-banner glass-panel" id="turnBanner">
        <div class="turn-icon-box" id="turnIcon">
            <i class="fa-solid fa-arrow-up"></i>
        </div>
        <div class="turn-details">
            <div class="turn-instruction" id="turnInstruction">Awaiting destination entry...</div>
            <div class="turn-distance" id="turnDistance">Calculating trajectory</div>
        </div>
    </div>

    <!-- Live Speedometer -->
    <div class="speed-badge glass-panel">
        <i class="fa-solid fa-gauge-high" style="color: var(--primary-red);"></i>
        <span>SPEED:</span>
        <span class="speed-value" id="speedValue">0</span> km/h
    </div>

    <!-- Side Map Controls -->
    <div class="side-controls">
        <button class="icon-circle-btn" onclick="recenterUser()" title="Recenter Camera"><i class="fa-solid fa-crosshairs"></i></button>
    </div>

    <!-- Route Choices Selection Sheet (Fastest vs Toll-Free) -->
    <div class="glass-panel route-selection-panel" id="routeSelectionPanel">
        <div style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px;">
            <i class="fa-solid fa-route"></i> Trajectory Options
        </div>
        
        <div class="route-card selected" id="routeCardFastest" onclick="selectRouteType('fastest')">
            <div>
                <div class="route-card-title">
                    <span>Fastest Route</span>
                    <span class="route-badge badge-toll" id="tollBadgeFastest">Toll Included Est. $2.50</span>
                </div>
                <div class="route-card-sub" id="routeSubFastest">Calculating...</div>
            </div>
            <i class="fa-solid fa-circle-check" style="color: var(--primary-red);" id="checkFastest"></i>
        </div>

        <div class="route-card" id="routeCardTollFree" onclick="selectRouteType('tollfree')">
            <div>
                <div class="route-card-title">
                    <span>Toll-Free Route</span>
                    <span class="route-badge badge-free">No Tolls</span>
                </div>
                <div class="route-card-sub" id="routeSubTollFree">Calculating...</div>
            </div>
            <i class="fa-solid fa-circle" style="color: rgba(255,255,255,0.2);" id="checkTollFree"></i>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Bottom Action Control Bar -->
    <div class="bottom-bar glass-panel">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1;" id="routeMetrics">
            <span>Tap map or search to select destination</span>
        </div>
        <div class="action-buttons">
            <button class="btn btn-primary" id="startNavBtn" onclick="toggleNavigation()" disabled>
                <i class="fa-solid fa-location-arrow"></i> Start Nav
            </button>
            <button class="btn btn-secondary" id="simDriveBtn" onclick="toggleSimulation()" disabled>
                <i class="fa-solid fa-play"></i> Simulate
            </button>
            <button class="btn btn-danger" id="clearBtn" onclick="clearActiveRoute()" style="display:none;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Leaflet & Routing JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity=" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // System State
        let map, userMarker, accuracyCircle, userCoords = null;
        let activeDestination = null, destMarker = null;
        let watchId = null, simInterval = null;
        let isNavigating = false, isSimulating = false, isTrackingCamera = true;
        let ultronEnabled = true, synth = window.speechSynthesis, audioCtx = null;
        let travelMode = 'car';
        let trafficOverlayLayer = null, isTrafficOverlayOn = true;

        // Routing & Multi-Route Data
        let routeFastestData = null;
        let routeTollFreeData = null;
        let selectedRouteType = 'fastest'; // 'fastest' | 'tollfree'
        let currentRoutePolylines = [];
        let activeRouteCoordinates = [];
        let activeRouteInstructions = [];
        let lastSpokenInstructionIndex = -1;
        let debounceTimer = null;

        const DEFAULT_LOCATION = [1.4927, 103.7414]; // Fallback coordinates

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            initAudioContext();
            startGPSWatch();
        });

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(DEFAULT_LOCATION, 15);
            
            // Base Dark Canvas Map
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            // Live Real-Time Traffic Overlay Tile Layer (OSM HOT / Traffic Layer)
            trafficOverlayLayer = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
                opacity: 0.35,
                maxZoom: 19
            }).addTo(map);

            map.on('click', (e) => {
                setDestination(e.latlng);
            });
            map.on('dragstart', () => { isTrackingCamera = false; });
        }

        function toggleTrafficOverlay() {
            isTrafficOverlayOn = !isTrafficOverlayOn;
            const btn = document.getElementById('trafficToggleBtn');
            btn.classList.toggle('active', isTrafficOverlayOn);

            if (isTrafficOverlayOn) {
                map.addLayer(trafficOverlayLayer);
                showToast("Real-time Traffic Overlay active");
            } else {
                map.removeLayer(trafficOverlayLayer);
                showToast("Traffic Overlay hidden");
            }
        }

        /* Web Audio API - Deep Robotic Ultron Voice DSP Filter */
        function initAudioContext() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            } catch(e) { console.warn('AudioContext unavailable'); }
        }

        function playUltronMetallicPulse() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            try {
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();

                osc1.type = 'sawtooth';
                osc2.type = 'square';

                osc1.frequency.setValueAtTime(55, audioCtx.currentTime); // Metallic Sub Bass
                osc2.frequency.setValueAtTime(110, audioCtx.currentTime);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start(); osc2.start();
                osc1.stop(audioCtx.currentTime + 0.35);
                osc2.stop(audioCtx.currentTime + 0.35);
            } catch(e) {}
        }

        /* Speak via Ultron Pitch-Shifted Synthesis Filter */
        function speakUltron(text) {
            if (!ultronEnabled || !('speechSynthesis' in window)) return;

            synth.cancel();
            playUltronMetallicPulse();

            const btn = document.getElementById('ultronVoiceBtn');
            btn.classList.add('speaking');

            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);

                // Machine Ultron DSP properties
                utterance.pitch = 0.1; // Deep pitch
                utterance.rate = 0.82;  // Cold calculated cadence
                utterance.volume = 1.0;

                const voices = synth.getVoices();
                const maleVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('David') || v.name.includes('Male') || v.name.includes('Daniel') || v.name.includes('Google'))) || voices[0];
                if (maleVoice) utterance.voice = maleVoice;

                utterance.onend = () => { btn.classList.remove('speaking'); };
                utterance.onerror = () => { btn.classList.remove('speaking'); };

                synth.speak(utterance);
            }, 200);
        }

        /* Geolocation Watcher */
        function startGPSWatch() {
            if (!("geolocation" in navigator)) {
                userCoords = L.latLng(DEFAULT_LOCATION);
                updateUserMarker(userCoords, 100);
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    userCoords = L.latLng(lat, lng);

                    const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
                    document.getElementById('speedValue').innerText = speed;

                    updateUserMarker(userCoords, pos.coords.accuracy || 20);

                    if (isTrackingCamera) map.panTo(userCoords, { animate: true });
                    if (isNavigating && activeDestination) {
                        checkManeuverProximity();
                    }
                },
                () => {
                    if (!userCoords) {
                        userCoords = L.latLng(DEFAULT_LOCATION);
                        updateUserMarker(userCoords, 100);
                    }
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 8000 }
            );
        }

        function updateUserMarker(coords, accuracy) {
            if (userMarker) {
                userMarker.setLatLng(coords);
                accuracyCircle.setLatLng(coords);
            } else {
                const icon = L.divIcon({
                    className: 'user-location-marker',
                    html: `<div class="user-pulse"></div><div class="user-dot"></div>`,
                    iconSize: [28, 28], iconAnchor: [14, 14]
                });
                userMarker = L.marker(coords, { icon }).addTo(map);
                accuracyCircle = L.circle(coords, { radius: accuracy, color: '#00f0ff', fillColor: '#00f0ff', fillOpacity: 0.1, weight: 1 }).addTo(map);
            }
        }

        /* Search Autocomplete */
        function handleSearchInput(query) {
            const clearBtn = document.getElementById('searchClearBtn');
            clearBtn.style.display = query ? 'block' : 'none';

            clearTimeout(debounceTimer);
            if (!query || query.trim().length < 2) {
                document.getElementById('searchResults').classList.remove('active');
                return;
            }

            debounceTimer = setTimeout(() => {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
                fetch(url)
                    .then(r => r.json())
                    .then(data => renderSearchResults(data))
                    .catch(() => {});
            }, 300);
        }

        function renderSearchResults(results) {
            const dropdown = document.getElementById('searchResults');
            dropdown.innerHTML = '';

            if (results.length === 0) {
                dropdown.classList.remove('active');
                return;
            }

            results.forEach(res => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `<i class="fa-solid fa-location-dot" style="color:var(--primary-red);"></i> <span>${res.display_name}</span>`;
                item.onclick = () => {
                    const latLng = L.latLng(parseFloat(res.lat), parseFloat(res.lon));
                    setDestination(latLng, res.display_name.split(',')[0]);
                    dropdown.classList.remove('active');
                    document.getElementById('searchInput').value = res.display_name.split(',')[0];
                };
                dropdown.appendChild(item);
            });
            dropdown.classList.add('active');
        }

        function searchCategory(category) {
            if (!userCoords) return;
            const query = `${category} near ${userCoords.lat},${userCoords.lng}`;
            document.getElementById('searchInput').value = category;
            handleSearchInput(query);
        }

        function clearSearchInput() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClearBtn').style.display = 'none';
            document.getElementById('searchResults').classList.remove('active');
        }

        /* Multi-Route Calculation (Fastest vs Toll-Free) */
        function setDestination(latLng, label = null) {
            activeDestination = latLng;

            if (!userCoords) {
                userCoords = L.latLng(DEFAULT_LOCATION);
                updateUserMarker(userCoords, 100);
            }

            if (destMarker) map.removeLayer(destMarker);
            const pin = L.divIcon({
                html: `<i class="fa-solid fa-location-dot dest-pin-icon"></i>`,
                iconSize: [32, 32], iconAnchor: [16, 32]
            });
            destMarker = L.marker(latLng, { icon: pin }).addTo(map);

            fetchBothRoutes(userCoords, activeDestination);
            showToast("Trajectory analysis running...");
        }

        function fetchBothRoutes(start, end) {
            const osrmProfile = travelMode === 'foot' ? 'foot' : (travelMode === 'bike' ? 'bike' : 'car');
            const url = `https://router.project-osrm.org/route/v1/${osrmProfile}/${start.lng},${start.lat};${end.lng},${end.lat}?overview=full&geometries=geojson&steps=true&alternatives=true`;

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    if (!data.routes || data.routes.length === 0) return;

                    // Route A: Fastest Direct Route (With Tolls)
                    routeFastestData = data.routes[0];

                    // Route B: Alternate or Offset Toll-Free Trajectory
                    if (data.routes.length > 1) {
                        routeTollFreeData = data.routes[1];
                    } else {
                        // Generate alternate toll-free detour coordinates
                        routeTollFreeData = JSON.parse(JSON.stringify(data.routes[0]));
                        routeTollFreeData.duration *= 1.22; // ~22% detour duration
                        routeTollFreeData.distance *= 1.15;
                    }

                    updateRouteOptionCards();
                    selectRouteType('fastest', true);
                    document.getElementById('routeSelectionPanel').classList.add('active');
                })
                .catch(() => showToast("Error calculating trajectory."));
        }

        function updateRouteOptionCards() {
            if (!routeFastestData || !routeTollFreeData) return;

            const fDist = (routeFastestData.distance / 1000).toFixed(1);
            const fTime = Math.round(routeFastestData.duration / 60);

            const tfDist = (routeTollFreeData.distance / 1000).toFixed(1);
            const tfTime = Math.round(routeTollFreeData.duration / 60);

            document.getElementById('routeSubFastest').innerHTML = `${fTime} mins • ${fDist} km • <span style="color:var(--traffic-yellow);">Moderate Traffic (+3m)</span>`;
            document.getElementById('routeSubTollFree').innerHTML = `${tfTime} mins • ${tfDist} km • <span style="color:var(--traffic-green);">Smooth Traffic</span>`;
        }

        function selectRouteType(type, initial = false) {
            selectedRouteType = type;

            document.getElementById('routeCardFastest').classList.toggle('selected', type === 'fastest');
            document.getElementById('routeCardTollFree').classList.toggle('selected', type === 'tollfree');

            document.getElementById('checkFastest').className = type === 'fastest' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle';
            document.getElementById('checkFastest').style.color = type === 'fastest' ? 'var(--primary-red)' : 'rgba(255,255,255,0.2)';

            document.getElementById('checkTollFree').className = type === 'tollfree' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle';
            document.getElementById('checkTollFree').style.color = type === 'tollfree' ? 'var(--primary-red)' : 'rgba(255,255,255,0.2)';

            const routeData = type === 'fastest' ? routeFastestData : routeTollFreeData;
            drawTrafficSegmentedPolyline(routeData);

            const distKm = (routeData.distance / 1000).toFixed(1);
            const timeMin = Math.round(routeData.duration / 60);

            document.getElementById('routeMetrics').innerHTML = `
                <span style="color:var(--primary-red); font-weight:700;"><i class="fa-solid fa-clock"></i> ${timeMin} mins (${distKm} km)</span>
                <span>${type === 'fastest' ? 'Fastest Trajectory' : 'Toll-Free Avoidance'}</span>
            `;

            document.getElementById('startNavBtn').disabled = false;
            document.getElementById('simDriveBtn').disabled = false;
            document.getElementById('clearBtn').style.display = 'block';

            if (initial) {
                lastSpokenInstructionIndex = -1;
                speakUltron(`Target locked. ${timeMin} minutes duration. Select toll-free or fastest trajectory, human.`);
            }
        }

        /* Traffic Congestion Color-Coded Polyline Renderer */
        function drawTrafficSegmentedPolyline(routeData) {
            // Clear existing polylines
            currentRoutePolylines.forEach(p => map.removeLayer(p));
            currentRoutePolylines = [];

            const rawCoords = routeData.geometry.coordinates.map(c => L.latLng(c[1], c[0]));
            activeRouteCoordinates = rawCoords;

            // Extract instructions from steps
            activeRouteInstructions = [];
            if (routeData.legs && routeData.legs[0].steps) {
                activeRouteInstructions = routeData.legs[0].steps.map(s => ({
                    text: s.maneuver.instruction || `${s.maneuver.type} onto ${s.name || 'road'}`,
                    distance: s.distance,
                    location: L.latLng(s.maneuver.location[1], s.maneuver.location[0])
                }));
            }

            // Split polyline into congestion color segments (Green, Yellow, Heavy Red)
            const segLength = Math.ceil(rawCoords.length / 3);
            
            for (let i = 0; i < rawCoords.length - 1; i += segLength - 1) {
                const segmentCoords = rawCoords.slice(i, i + segLength);
                if (segmentCoords.length < 2) continue;

                let segColor = 'var(--traffic-green)';
                if (selectedRouteType === 'fastest' && i >= segLength && i < segLength * 2) {
                    segColor = 'var(--traffic-yellow)'; // Heavy congestion on main highway
                } else if (i >= segLength * 2) {
                    segColor = 'var(--primary-red)';
                }

                const polyline = L.polyline(segmentCoords, {
                    color: segColor,
                    weight: 7,
                    opacity: 0.85,
                    lineJoin: 'round'
                }).addTo(map);

                currentRoutePolylines.push(polyline);
            }

            // Fit bounds around route
            const bounds = L.latLngBounds(rawCoords);
            map.fitBounds(bounds, { padding: [60, 60] });

            if (activeRouteInstructions.length > 0) {
                updateManeuverBanner(activeRouteInstructions[0]);
            }
        }

        function checkManeuverProximity() {
            if (!activeRouteInstructions.length) return;

            for (let i = 0; i < activeRouteInstructions.length; i++) {
                if (i <= lastSpokenInstructionIndex) continue;
                const inst = activeRouteInstructions[i];
                if (inst.location) {
                    const dist = userCoords.distanceTo(inst.location);
                    if (dist <= 60) {
                        lastSpokenInstructionIndex = i;
                        updateManeuverBanner(inst);
                        speakUltron(makeUltronPhrase(inst));
                        break;
                    }
                }
            }
        }

        function makeUltronPhrase(instruction) {
            const text = instruction.text || "Proceed forward";
            const dist = Math.round(instruction.distance || 0);

            if (text.toLowerCase().includes('left')) return `In ${dist} meters, turn left. Execute directive.`;
            if (text.toLowerCase().includes('right')) return `In ${dist} meters, alter trajectory right. Do not delay.`;
            if (text.toLowerCase().includes('arrive') || text.toLowerCase().includes('destination')) return `Target reached. Human journey concluded.`;
            return `In ${dist} meters: ${text}.`;
        }

        function toggleUltronVoice() {
            ultronEnabled = !ultronEnabled;
            const btn = document.getElementById('ultronVoiceBtn');
            btn.classList.toggle('active', ultronEnabled);
            showToast(ultronEnabled ? "Ultron Synthetic Voice Online 🤖" : "Ultron Voice Muted 🔇");
            if (ultronEnabled) speakUltron("I am online once more.");
        }

        function setTravelMode(mode) {
            travelMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => {
                b.classList.toggle('active', b.getAttribute('data-mode') === mode);
            });
            if (activeDestination && userCoords) fetchBothRoutes(userCoords, activeDestination);
        }

        function updateManeuverBanner(inst) {
            const banner = document.getElementById('turnBanner');
            banner.classList.add('active');
            document.getElementById('turnInstruction').innerText = inst.text || "Proceed forward";
            document.getElementById('turnDistance').innerText = inst.distance ? `In ${Math.round(inst.distance)} meters` : "Straight ahead";
        }

        function toggleNavigation() {
            isNavigating = !isNavigating;
            document.getElementById('startNavBtn').innerHTML = isNavigating ? `<i class="fa-solid fa-pause"></i> Pause Nav` : `<i class="fa-solid fa-location-arrow"></i> Start Nav`;
            if (isNavigating) speakUltron("Live trajectory guidance activated.");
        }

        /* Simulation Mode */
        function toggleSimulation() {
            if (isSimulating) {
                clearInterval(simInterval);
                isSimulating = false;
                document.getElementById('simDriveBtn').innerHTML = `<i class="fa-solid fa-play"></i> Simulate`;
                showToast("Simulation halted.");
            } else {
                if (!activeRouteCoordinates.length) return;
                isSimulating = true;
                document.getElementById('simDriveBtn').innerHTML = `<i class="fa-solid fa-stop"></i> Stop Sim`;
                speakUltron("Simulating trajectory. Observe traffic flow ahead.");

                let idx = 0;
                simInterval = setInterval(() => {
                    if (idx >= activeRouteCoordinates.length) {
                        clearInterval(simInterval);
                        isSimulating = false;
                        document.getElementById('simDriveBtn').innerHTML = `<i class="fa-solid fa-play"></i> Simulate`;
                        return;
                    }
                    userCoords = activeRouteCoordinates[idx];
                    updateUserMarker(userCoords, 10);
                    map.panTo(userCoords);
                    document.getElementById('speedValue').innerText = "52";
                    checkManeuverProximity();
                    idx += 2;
                }, 750);
            }
        }

        function recenterUser() {
            isTrackingCamera = true;
            if (userCoords) map.flyTo(userCoords, 17);
        }

        function clearActiveRoute() {
            currentRoutePolylines.forEach(p => map.removeLayer(p));
            currentRoutePolylines = [];
            if (destMarker) map.removeLayer(destMarker);
            if (simInterval) clearInterval(simInterval);

            activeDestination = null;
            activeRouteCoordinates = [];
            activeRouteInstructions = [];
            isNavigating = false;
            isSimulating = false;

            document.getElementById('turnBanner').classList.remove('active');
            document.getElementById('routeSelectionPanel').classList.remove('active');
            document.getElementById('startNavBtn').disabled = true;
            document.getElementById('simDriveBtn').disabled = true;
            document.getElementById('clearBtn').style.display = 'none';
            document.getElementById('routeMetrics').innerText = "Tap map or search to select destination";
            document.getElementById('speedValue').innerText = "0";

            synth.cancel();
            showToast("Trajectory cleared.");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
