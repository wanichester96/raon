<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>raon map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #030508;
            --primary-red: #ff2a2a;
            --primary-glow: rgba(255, 42, 42, 0.4);
            --cyan-accent: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.3);
            --traffic-green: #10b981;
            --traffic-yellow: #f59e0b;
            --traffic-red: #ef4444;
            --glass-bg: rgba(10, 12, 18, 0.92);
            --glass-border: rgba(255, 255, 255, 0.14);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            height: 100%; 
            width: 100%; 
            overflow: hidden;
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }

        #map { 
            position: absolute; 
            inset: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 0; 
            background: var(--bg-color); 
        }

        .dark-tiles .leaflet-tile {
            filter: brightness(0.6) saturate(0.6) contrast(1.2) hue-rotate(190deg) invert(0.92);
        }
        .leaflet-container { background: var(--bg-color) !important; font-family: inherit; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            border-radius: 20px;
        }

        /* ---------- Top Header Layout & Search Dropdown Fix ---------- */
        .top-container {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 10px);
            left: 10px; 
            right: 10px;
            z-index: 2000;
            display: flex; 
            flex-direction: column; 
            gap: 8px;
        }

        .search-box-panel { 
            padding: 8px 10px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            position: relative; 
            z-index: 2500;
        }

        .search-input-wrapper {
            flex: 1; 
            display: flex; 
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px; 
            padding: 8px 10px; 
            gap: 8px;
            transition: all 0.2s ease;
        }

        .search-input-wrapper:focus-within {
            border-color: var(--primary-red);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .search-input-wrapper input {
            background: transparent; 
            border: none; 
            outline: none; 
            color: #fff;
            font-size: 14px; 
            width: 100%; 
            font-weight: 500;
        }

        .search-input-wrapper input::placeholder { color: rgba(255, 255, 255, 0.45); }

        .mic-btn {
            background: rgba(255, 42, 42, 0.15);
            border: 1px solid var(--primary-red);
            color: var(--primary-red);
            width: 32px; 
            height: 32px;
            border-radius: 10px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            font-size: 13px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .mic-btn.listening {
            background: var(--primary-red);
            color: #fff;
            animation: micPulse 1s infinite alternate;
        }

        @keyframes micPulse {
            0% { box-shadow: 0 0 8px var(--primary-red); }
            100% { box-shadow: 0 0 22px var(--primary-red); }
        }

        /* FIX: Increased z-index to overlay on top of all controls */
        .search-results-dropdown {
            position: absolute; 
            top: calc(100% + 6px); 
            left: 0; 
            right: 0;
            max-height: 280px; 
            overflow-y: auto;
            display: none; 
            flex-direction: column; 
            z-index: 4000; 
            padding: 6px;
            background: rgba(8, 10, 16, 0.96);
            border: 1px solid var(--primary-red);
            box-shadow: 0 20px 48px rgba(0,0,0,0.95);
        }

        .search-results-dropdown.active { display: flex; }

        .search-item {
            padding: 11px 12px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 13px;
            display: flex; 
            align-items: center; 
            gap: 10px;
            transition: background 0.2s ease; 
            color: #e2e8f0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .search-item:last-child { border-bottom: none; }

        .search-item:hover, .search-item:active { 
            background: rgba(255, 42, 42, 0.25); 
            color: #fff; 
        }

        .shortcuts-row { 
            display: flex; 
            gap: 6px; 
            overflow-x: auto; 
            padding-bottom: 2px; 
            scrollbar-width: none; 
            z-index: 1000;
        }

        .shortcuts-row::-webkit-scrollbar { display: none; }

        .chip-btn {
            background: rgba(18, 22, 32, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px; 
            padding: 6px 12px;
            font-size: 12px; 
            font-weight: 600; 
            color: #cbd5e1;
            white-space: nowrap; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 6px;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .chip-btn:hover, .chip-btn:active {
            background: rgba(255, 42, 42, 0.25);
            border-color: var(--primary-red); 
            color: #fff;
        }

        .header-controls-bar {
            padding: 6px 10px; 
            display: flex; 
            align-items: center;
            justify-content: space-between; 
            gap: 6px;
            z-index: 1000;
        }

        .mode-selector {
            display: flex; 
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px; 
            padding: 3px; 
            gap: 3px;
        }

        .mode-btn {
            background: transparent; 
            border: none; 
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 8px; 
            border-radius: 9px; 
            font-size: 11px; 
            cursor: pointer;
            transition: all 0.2s ease; 
            display: flex; 
            align-items: center; 
            gap: 4px;
        }

        .mode-btn.active {
            background: var(--primary-red); 
            color: #fff;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        .toggle-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1; 
            padding: 6px 8px; 
            border-radius: 12px;
            font-size: 11px; 
            font-weight: 600; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 5px;
            transition: all 0.2s ease;
        }

        .toggle-chip.active {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--cyan-accent);
            color: var(--cyan-accent);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        .ultron-voice-btn {
            background: rgba(255, 42, 42, 0.15);
            border: 1px solid var(--primary-red);
            color: var(--primary-red);
            padding: 6px 10px; 
            border-radius: 12px;
            font-size: 11px; 
            font-weight: 700; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            gap: 5px;
            transition: all 0.2s ease; 
            position: relative;
        }

        .ultron-voice-btn.active {
            background: var(--primary-red); 
            color: #fff;
            box-shadow: 0 0 14px var(--primary-glow);
        }

        .ultron-voice-btn.speaking { animation: voicePulse 0.8s infinite alternate; }

        @keyframes voicePulse {
            0% { box-shadow: 0 0 8px var(--primary-red); transform: scale(1); }
            100% { box-shadow: 0 0 22px var(--primary-red); transform: scale(1.04); }
        }

        /* ---------- Turn Banner Mobile Optimizations ---------- */
        .turn-banner {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 140px);
            left: 10px; 
            right: 10px; 
            z-index: 999;
            padding: 10px 14px; 
            display: none; 
            align-items: center; 
            gap: 12px;
            background: linear-gradient(135deg, rgba(20, 8, 12, 0.95), rgba(8, 12, 22, 0.95));
            border: 1px solid var(--primary-red);
            box-shadow: 0 10px 30px var(--primary-glow);
        }

        .turn-banner.active { display: flex; }

        .turn-icon-box {
            width: 40px; 
            height: 40px; 
            border-radius: 12px;
            background: rgba(255, 42, 42, 0.2);
            border: 1px solid var(--primary-red);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 18px; 
            color: var(--primary-red);
        }

        .turn-details { flex: 1; min-width: 0; }
        .turn-instruction { font-size: 13px; font-weight: 700; color: #fff; }
        .turn-distance { font-size: 11px; color: var(--primary-red); font-weight: 600; margin-top: 1px; }

        /* ---------- Speed Badge & Side Floating Controls ---------- */
        .speed-badge {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 220px);
            left: 10px; 
            z-index: 999;
            padding: 6px 12px; 
            display: flex; 
            align-items: center; 
            gap: 6px;
            font-size: 11px; 
            font-weight: 700;
            border: 1px solid rgba(255, 42, 42, 0.3);
        }

        .speed-value { font-size: 16px; color: var(--primary-red); }

        .side-controls {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 220px);
            right: 10px; 
            z-index: 999;
            display: flex; 
            flex-direction: column; 
            gap: 8px;
        }

        .icon-circle-btn {
            width: 38px; 
            height: 38px; 
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(10, 12, 18, 0.88);
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            font-size: 15px; 
            transition: all 0.2s ease;
        }

        .icon-circle-btn:hover {
            background: rgba(255, 42, 42, 0.3);
            border-color: var(--primary-red);
        }

        /* ---------- Route Selection Options ---------- */
        .route-selection-panel {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 130px);
            left: 10px; 
            right: 10px; 
            z-index: 1000;
            padding: 10px; 
            display: none; 
            flex-direction: column; 
            gap: 6px;
            max-height: 38vh; 
            overflow-y: auto;
        }

        .route-selection-panel.active { display: flex; }

        .route-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px; 
            padding: 8px 12px;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .route-card:hover, .route-card.selected {
            background: rgba(255, 42, 42, 0.18);
            border-color: var(--primary-red);
            box-shadow: 0 0
