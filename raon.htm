<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>raon map</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Deep warm-black base */
            --bg-color: #0b0a0d;
            --bg-vignette: #141117;

            /* Ink — warm off-white */
            --ink: #ede8e2;
            --ink-soft: rgba(237, 232, 226, 0.58);
            --ink-faint: rgba(237, 232, 226, 0.32);
            --hairline: rgba(237, 232, 226, 0.1);
            --hairline-strong: rgba(237, 232, 226, 0.22);

            /* Muted glass */
            --glass-bg: rgba(20, 17, 23, 0.52);
            --glass-bg-deep: rgba(20, 17, 23, 0.82);
            --glass-highlight: rgba(237, 232, 226, 0.06);

            /* Muted accent palette — dusty rose, teal, sand, lilac */
            --rose: #c48b9f;
            --rose-soft: rgba(196, 139, 159, 0.16);
            --teal: #7fa9a0;
            --teal-soft: rgba(127, 169, 160, 0.16);
            --sand: #c9b895;
            --sand-soft: rgba(201, 184, 149, 0.16);
            --lilac: #a394b8;
            --lilac-soft: rgba(163, 148, 184, 0.16);

            /* Muted traffic status colors */
            --traffic-clear: #7fa9a0;   /* muted teal */
            --traffic-moderate: #c9b895; /* warm sand */
            --traffic-jammed: #8f4a5a;   /* deep rose-maroon */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; width: 100%; overflow: hidden;
            background: var(--bg-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            color: var(--ink);
        }

        /* Soft ambient colored glow behind the UI */
        body::before {
            content: '';
            position: fixed;
            inset: -30%;
            background:
                radial-gradient(circle at 15% 20%, rgba(196, 139, 159, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(127, 169, 160, 0.09) 0%, transparent 50%),
                radial-gradient(circle at 60% 95%, rgba(163, 148, 184, 0.08) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
            animation: ambientFloat 26s ease-in-out infinite;
        }
        @keyframes ambientFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50%      { transform: translate(3%, -2%) rotate(2deg); }
        }

        #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; background: var(--bg-color); }

        /* Muted monochrome tiles with a slight warm tint */
        .dark-tiles .leaflet-tile {
            filter: grayscale(0.9) brightness(0.62) contrast(1.05) sepia(0.12);
        }
        .leaflet-container { background: var(--bg-color) !important; font-family: inherit; }

        /* ---------- Glass ---------- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(140%);
            -webkit-backdrop-filter: blur(40px) saturate(140%);
            border: 1px solid var(--hairline);
            box-shadow:
                0 24px 64px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 var(--glass-highlight);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        /* Subtle top sheen */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(237,232,226,0.04) 0%, transparent 100%);
            pointer-events: none;
        }

        /* ---------- Top Header ---------- */
        .top-container {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            left: 12px; right: 12px;
            z-index: 2000;
            display: flex; flex-direction: column; gap: 8px;
        }

        .search-box-panel {
            padding: 6px;
            display: flex; align-items: center; gap: 8px;
            position: relative; z-index: 2500;
        }

        .search-input-wrapper {
            flex: 1; display: flex; align-items: center;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 2px; padding: 10px 12px; gap: 10px;
            transition: all 0.3s ease;
        }
        .search-input-wrapper:focus-within {
            border-color: rgba(196, 139, 159, 0.4);
            background: rgba(196, 139, 159, 0.05);
        }
        .search-input-wrapper input {
            background: transparent; border: none; outline: none; color: var(--ink);
            font-family: 'Playfair Display', serif;
            font-size: 15px; width: 100%; font-weight: 400;
            font-style: italic; letter-spacing: 0.2px;
        }
        .search-input-wrapper input::placeholder {
            color: var(--ink-faint); font-style: italic;
        }

        .mic-btn {
            background: transparent;
            border: 1px solid var(--hairline);
            color: var(--ink-soft);
            width: 32px; height: 32px; border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 12px; transition: all 0.3s ease; flex-shrink: 0;
        }
        .mic-btn:hover { border-color: var(--rose); color: var(--rose); }
        .mic-btn.listening {
            background: var(--rose-soft);
            color: var(--rose);
            border-color: var(--rose);
            animation: micPulse 1.2s infinite alternate;
        }
        @keyframes micPulse {
            0%   { box-shadow: 0 0 0 0 rgba(196,139,159,0.4); }
            100% { box-shadow: 0 0 0 8px rgba(196,139,159,0); }
        }

        .search-results-dropdown {
            position: absolute; top: calc(100% + 6px); left: 0; right: 0;
            max-height: 280px; overflow-y: auto;
            display: none; flex-direction: column; z-index: 4000; padding: 4px;
            background: var(--glass-bg-deep);
            backdrop-filter: blur(36px) saturate(140%);
            -webkit-backdrop-filter: blur(36px) saturate(140%);
            border: 1px solid var(--hairline-strong);
            box-shadow: 0 24px 64px rgba(0,0,0,0.9);
            border-radius: 4px;
        }
        .search-results-dropdown.active { display: flex; }

        .search-item {
            padding: 12px 14px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 12px;
            transition: background 0.3s ease; color: var(--ink-soft);
            border-bottom: 1px solid var(--hairline);
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover, .search-item:active {
            background: var(--rose-soft); color: var(--ink);
        }
        .search-item i { color: var(--rose); }

        /* ---------- Shortcuts ---------- */
        .shortcuts-row {
            display: flex; gap: 6px; overflow-x: auto;
            padding-bottom: 2px; scrollbar-width: none; z-index: 1000;
        }
        .shortcuts-row::-webkit-scrollbar { display: none; }

        .chip-btn {
            background: rgba(20, 17, 23, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--hairline);
            border-radius: 2px;
            padding: 8px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 10px; font-weight: 500;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--ink-soft);
            white-space: nowrap; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.3s ease;
        }
        .chip-btn:hover, .chip-btn:active {
            background: var(--rose-soft);
            border-color: rgba(196, 139, 159, 0.35);
            color: var(--ink);
        }
        .chip-btn i { color: var(--rose); }
        .chip-btn:nth-child(2) i { color: var(--teal); }
        .chip-btn:nth-child(3) i { color: var(--sand); }
        .chip-btn:nth-child(4) i { color: var(--lilac); }
        .chip-btn:nth-child(5) i { color: var(--rose); }
        .chip-btn:nth-child(2):hover { background: var(--teal-soft); border-color: rgba(127, 169, 160, 0.35); }
        .chip-btn:nth-child(3):hover { background: var(--sand-soft); border-color: rgba(201, 184, 149, 0.35); }
        .chip-btn:nth-child(4):hover { background: var(--lilac-soft); border-color: rgba(163, 148, 184, 0.35); }

        /* ---------- Controls Bar ---------- */
        .header-controls-bar {
            padding: 6px; display: flex; align-items: center;
            justify-content: space-between; gap: 6px; z-index: 1000;
        }

        .mode-selector {
            display: flex; background: transparent;
            border: 1px solid var(--hairline); border-radius: 2px; padding: 3px; gap: 2px;
        }
        .mode-btn {
            background: transparent; border: none; color: var(--ink-faint);
            padding: 6px 10px; border-radius: 1px;
            font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 6px;
        }
        .mode-btn.active {
            background: var(--rose-soft);
            color: var(--rose);
            box-shadow: inset 0 0 0 1px rgba(196, 139, 159, 0.3);
        }

        .ultron-voice-btn {
            background: transparent; border: 1px solid var(--hairline);
            color: var(--ink-soft); padding: 8px 14px; border-radius: 2px;
            font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: all 0.3s ease; position: relative;
        }
        .ultron-voice-btn.active {
            background: var(--teal-soft);
            color: var(--teal);
            border-color: rgba(127, 169, 160, 0.4);
        }
        .ultron-voice-btn.speaking {
            animation: voicePulse 0.7s infinite alternate;
        }
        @keyframes voicePulse {
            0%   { box-shadow: 0 0 0 0 rgba(127,169,160,0.5); color: var(--rose); }
            100% { box-shadow: 0 0 0 8px rgba(127,169,160,0); color: var(--teal); }
        }

        /* ---------- Turn Banner ---------- */
        .turn-banner {
            position: absolute; top: calc(env(safe-area-inset-top, 0px) + 148px);
            left: 12px; right: 12px; z-index: 999; padding: 14px 18px;
            display: none; align-items: center; gap: 16px;
            background: var(--glass-bg-deep);
            backdrop-filter: blur(36px) saturate(140%);
            -webkit-backdrop-filter: blur(36px) saturate(140%);
            border: 1px solid rgba(196, 139, 159, 0.25);
            border-radius: 4px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.85);
        }
        .turn-banner.active { display: flex; }

        .turn-icon-box {
            width: 44px; height: 44px; border-radius: 2px;
            background: var(--rose-soft);
            border: 1px solid rgba(196, 139, 159, 0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--rose); flex-shrink: 0;
        }
        .turn-details { flex: 1; min-width: 0; }
        .turn-instruction {
            font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 500;
            color: var(--ink); letter-spacing: -0.2px; line-height: 1.3;
        }
        .turn-distance {
            font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 500;
            letter-spacing: 2.5px; text-transform: uppercase; color: var(--rose); margin-top: 4px;
        }

        /* ---------- Speed Badge ---------- */
        .speed-badge {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 230px);
            left: 12px; z-index: 999; padding: 10px 16px;
            display: flex; align-items: center; gap: 10px;
            font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 500;
            letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink-faint);
        }
        .speed-value {
            font-family: 'Playfair Display', serif; font-size: 22px;
            color: var(--teal); letter-spacing: -0.5px; font-weight: 500;
        }
        .speed-badge i { color: var(--teal); font-size: 13px; }

        /* ---------- Side Controls ---------- */
        .side-controls {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 230px);
            right: 12px; z-index: 999; display: flex; flex-direction: column; gap: 8px;
        }
        .icon-circle-btn {
            width: 40px; height: 40px; border-radius: 2px;
            border: 1px solid var(--hairline); background: var(--glass-bg);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            color: var(--ink-soft); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px; transition: all 0.3s ease;
        }
        .icon-circle-btn:hover {
            background: var(--lilac-soft);
            border-color: rgba(163, 148, 184, 0.4);
            color: var(--lilac);
        }

        /* ---------- Route Selection ---------- */
        .route-selection-panel {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 140px);
            left: 12px; right: 12px; z-index: 1000; padding: 10px;
            display: none; flex-direction: column; gap: 6px;
            max-height: 38vh; overflow-y: auto;
        }
        .route-selection-panel.active { display: flex; }

        .route-card {
            background: transparent; border: 1px solid var(--hairline); border-radius: 2px;
            padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.3s ease; gap: 12px;
        }
        .route-card:hover { background: rgba(237, 232, 226, 0.04); border-color: var(--hairline-strong); }
        .route-card.selected {
            background: var(--rose-soft);
            border-color: rgba(196, 139, 159, 0.45);
        }
        .route-card-title {
            font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 500;
            display: flex; align-items: center; gap: 8px; color: var(--ink); letter-spacing: -0.1px;
        }
        .route-badge {
            font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 500;
            letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 7px;
            border-radius: 1px; border: 1px solid var(--hairline-strong);
            color: var(--ink-soft); background: transparent;
        }
        .badge-fast { border-color: var(--rose); color: var(--rose); }
        .badge-free { border-color: var(--teal); color: var(--teal); }
        .route-card-sub {
            font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 400;
            letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-faint); margin-top: 4px;
        }
        .route-card i { color: var(--ink-faint); font-size: 12px; }
        .route-card.selected i { color: var(--rose); }

        /* ---------- Bottom Action Bar ---------- */
        .bottom-bar {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px);
            left: 12px; right: 12px; z-index: 1000; padding: 12px 14px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .action-buttons { display: flex; gap: 6px; width: 100%; }

        .btn {
            border: 1px solid var(--hairline); padding: 12px 14px; border-radius: 2px;
            font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
            letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft);
            background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.3s ease; flex: 1;
        }
        .btn:hover { border-color: var(--hairline-strong); color: var(--ink); background: rgba(237,232,226,0.04); }
        .btn-primary {
            background: var(--rose);
            color: var(--bg-color);
            border-color: var(--rose);
        }
        .btn-primary:hover {
            background: #d5a2b3;
            border-color: #d5a2b3;
            color: var(--bg-color);
        }
        .btn-secondary { background: transparent; color: var(--teal); border-color: rgba(127, 169, 160, 0.3); }
        .btn-secondary:hover { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
        .btn-danger {
            background: transparent;
            border-color: rgba(143, 74, 90, 0.5);
            color: var(--traffic-jammed);
        }
        .btn-danger:hover { background: rgba(143, 74, 90, 0.15); border-color: var(--traffic-jammed); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #routeMetrics {
            font-family: 'Inter', sans-serif; font-size: 10px;
            letter-spacing: 2px; text-transform: uppercase; color: var(--ink-faint);
        }
        #routeMetrics strong { color: var(--rose); font-weight: 500; }

        /* ---------- Markers ---------- */
        .user-location-marker { position: relative; width: 28px; height: 28px; }
        .user-dot {
            width: 14px; height: 14px;
            background: var(--teal);
            border: 2px solid var(--bg-color);
            border-radius: 50%;
            box-shadow: 0 0 0 1px var(--teal), 0 0 24px rgba(127, 169, 160, 0.8);
            position: absolute; top: 7px; left: 7px; z-index: 2;
        }
        .user-pulse {
            width: 40px; height: 40px;
            background: radial-gradient(circle, rgba(127, 169, 160, 0.5) 0%, transparent 70%);
            border-radius: 50%; position: absolute; top: -6px; left: -6px;
            animation: pulse-ring 2.4s infinite ease-out;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.3); opacity: 0.9; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        .dest-pin-icon {
            font-size: 26px; color: var(--rose);
            filter: drop-shadow(0 0 12px rgba(196, 139, 159, 0.9));
        }
        .leaflet-routing-container { display: none !important; }

        /* ---------- Toast ---------- */
        .toast-msg {
            position: absolute; top: calc(env(safe-area-inset-top, 0px) + 60px);
            left: 50%; transform: translateX(-50%);
            background: var(--glass-bg-deep);
            backdrop-filter: blur(32px) saturate(140%);
            -webkit-backdrop-filter: blur(32px) saturate(140%);
            border: 1px solid rgba(196, 139, 159, 0.3);
            color: var(--ink);
            padding: 10px 20px; border-radius: 2px;
            font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
            letter-spacing: 2px; text-transform: uppercase;
            z-index: 5000; opacity: 0; pointer-events: none; transition: all 0.3s ease;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85); white-space: nowrap;
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(8px); }

        /* ---------- Tab Bar ---------- */
        .tab-bar {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
            left: 12px; right: 12px; z-index: 1100;
            display: flex; align-items: center; justify-content: space-around;
            padding: 8px; border-radius: 3px;
        }
        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
            background: transparent; border: none; color: var(--ink-faint);
            padding: 6px 0; font-family: 'Inter', sans-serif;
            font-size: 8px; font-weight: 500; letter-spacing: 1.8px; text-transform: uppercase;
            cursor: pointer; transition: all 0.3s ease; border-radius: 2px;
        }
        .tab-btn i { font-size: 14px; }
        .tab-btn.active { color: var(--rose); }
        .tab-btn.active i { filter: drop-shadow(0 0 8px rgba(196, 139, 159, 0.7)); }
        .tab-btn:nth-child(2).active { color: var(--teal); }
        .tab-btn:nth-child(2).active i { filter: drop-shadow(0 0 8px rgba(127, 169, 160, 0.7)); }
        .tab-btn:nth-child(3).active { color: var(--sand); }
        .tab-btn:nth-child(3).active i { filter: drop-shadow(0 0 8px rgba(201, 184, 149, 0.7)); }
        .tab-btn:nth-child(4).active { color: var(--lilac); }
        .tab-btn:nth-child(4).active i { filter: drop-shadow(0 0 8px rgba(163, 148, 184, 0.7)); }

        /* ---------- Overlay Panels ---------- */
        .overlay-panel {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 3000; display: none;
            background: rgba(11, 10, 13, 0.94);
            backdrop-filter: blur(32px) saturate(140%);
            -webkit-backdrop-filter: blur(32px) saturate(140%);
            padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px calc(env(safe-area-inset-bottom, 0px) + 90px);
            animation: fadeIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .overlay-panel.active { display: flex; flex-direction: column; }

        .overlay-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; padding-bottom: 16px;
            border-bottom: 1px solid var(--hairline);
        }
        .overlay-title {
            font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 400;
            letter-spacing: -0.8px; color: var(--ink); font-style: italic;
        }
        #panel-recents .overlay-title { color: var(--teal); }
        #panel-saved .overlay-title { color: var(--sand); }
        #panel-settings .overlay-title { color: var(--lilac); }
        .overlay-close {
            width: 36px; height: 36px; border-radius: 2px; background: transparent;
            border: 1px solid var(--hairline); color: var(--ink-soft);
            font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .overlay-close:hover { border-color: var(--hairline-strong); color: var(--ink); }

        .overlay-content {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px;
        }

        .list-card {
            background: rgba(237, 232, 226, 0.03);
            border: 1px solid var(--hairline); border-radius: 2px;
            padding: 14px 16px; display: flex; align-items: center; gap: 14px;
            cursor: pointer; transition: all 0.3s ease;
        }
        .list-card:hover { background: rgba(237, 232, 226, 0.06); border-color: var(--hairline-strong); }
        .list-icon {
            width: 36px; height: 36px; border-radius: 2px;
            background: var(--teal-soft);
            color: var(--teal);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0; border: 1px solid rgba(127, 169, 160, 0.25);
        }
