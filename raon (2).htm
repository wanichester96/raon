<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>raon // nav</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Hyper-Glass & Deep Cyberpunk Palette */
            --bg-color: #05020c;
            --bg-deep: #020106;
            --ink: #f0f7ff;
            --ink-soft: rgba(240, 247, 255, 0.72);
            --ink-faint: rgba(240, 247, 255, 0.38);

            /* Iridescent Neon Accents */
            --magenta: #ff2a85;
            --magenta-soft: rgba(255, 42, 133, 0.18);
            --magenta-glow: rgba(255, 42, 133, 0.55);
            --cyan: #00f5ff;
            --cyan-soft: rgba(0, 245, 255, 0.16);
            --cyan-glow: rgba(0, 245, 255, 0.5);
            --yellow: #ffd60a;
            --yellow-soft: rgba(255, 214, 10, 0.16);
            --purple: #b833ff;
            --purple-soft: rgba(184, 51, 255, 0.18);

            /* Liquid Hyper-Glass Tokens */
            --glass-bg: rgba(12, 6, 24, 0.55);
            --glass-bg-deep: rgba(8, 4, 18, 0.82);
            --glass-border: rgba(0, 245, 255, 0.24);
            --glass-border-magenta: rgba(255, 42, 133, 0.35);
            --glass-highlight: rgba(255, 255, 255, 0.08);
            --shadow-hyper: 0 30px 90px rgba(0, 0, 0, 0.95), 0 0 35px rgba(0, 245, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; width: 100%; overflow: hidden;
            background: var(--bg-color);
            font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--ink);
            position: relative;
        }

        /* Subtle cyber scanlines */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 245, 255, 0.015) 0px,
                rgba(0, 245, 255, 0.015) 1px,
                transparent 1px,
                transparent 4px
            );
            pointer-events: none; z-index: 9999;
            mix-blend-mode: screen;
        }

        /* Ambient Iridescent Gradient Mesh */
        body::before {
            content: '';
            position: fixed; inset: -30%;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 42, 133, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 245, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(184, 51, 255, 0.08) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
            animation: ambientDrift 16s ease-in-out infinite alternate;
        }
        @keyframes ambientDrift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.08) translate(-2%, 2%); }
        }

        #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; background: var(--bg-deep); }

        /* Sophisticated dark tactical map filter */
        .dark-tiles .leaflet-tile {
            filter: brightness(0.5) contrast(1.3) saturate(0.3) hue-rotate(210deg) invert(0.92);
        }
        .leaflet-container { background: var(--bg-deep) !important; font-family: inherit; }

        /* Liquid Hyper-Glass Panel */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(36px) saturate(200%);
            -webkit-backdrop-filter: blur(36px) saturate(200%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-hyper);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        /* Specular light highlight on glass */
        .glass-panel::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
            pointer-events: none;
        }

        .top-container {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 14px);
            left: 14px; right: 14px;
            z-index: 2000;
            display: flex; flex-direction: column; gap: 10px;
        }

        .search-box-panel {
            padding: 8px;
            display: flex; align-items: center; gap: 10px;
            position: relative; z-index: 2500;
        }

        .search-input-wrapper {
            flex: 1; display: flex; align-items: center;
            background: rgba(0, 245, 255, 0.04);
            border: 1px solid rgba(0, 245, 255, 0.12);
            border-radius: 8px; padding: 10px 14px; gap: 12px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .search-input-wrapper:focus-within {
            border-color: var(--cyan);
            background: rgba(0, 245, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.25), inset 0 0 10px rgba(0, 245, 255, 0.1);
        }
        .search-input-wrapper input {
            background: transparent; border: none; outline: none; color: var(--ink);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px; width: 100%; font-weight: 400;
            letter-spacing: 0.8px;
        }
        .search-input-wrapper input::placeholder {
            color: var(--ink-faint); letter-spacing: 1.5px;
        }

        .mic-btn {
            background: rgba(0, 245, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--cyan);
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 13px; transition: all 0.3s ease; flex-shrink: 0;
        }
        .mic-btn:hover {
            border-color: var(--cyan); color: var(--ink); background: var(--cyan-soft);
            box-shadow: 0 0 16px var(--cyan-glow);
        }
        .mic-btn.listening {
            background: var(--magenta-soft); color: var(--magenta); border-color: var(--magenta);
            animation: micPulse 1s infinite alternate;
        }
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 var(--magenta-glow); }
            100% { box-shadow: 0 0 0 10px transparent; }
        }

        .search-results-dropdown {
            position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            max-height: 300px; overflow-y: auto;
            display: none; flex-direction: column; z-index: 4000; padding: 6px;
            background: var(--glass-bg-deep);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 35px rgba(0, 245, 255, 0.35), 0 30px 90px rgba(0,0,0,0.95);
            border-radius: 10px;
        }
        .search-results-dropdown.active { display: flex; }

        .search-item {
            padding: 12px 16px; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; gap: 12px;
            transition: all 0.2s ease; color: var(--ink-soft);
            border-bottom: 1px solid rgba(0, 245, 255, 0.06);
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover, .search-item:active {
            background: var(--cyan-soft); color: var(--ink);
            border-left: 3px solid var(--cyan);
            padding-left: 18px;
        }
        .search-item i { color: var(--cyan); }

        .shortcuts-row {
            display: flex; gap: 8px; overflow-x: auto;
            padding-bottom: 2px; scrollbar-width: none; z-index: 1000;
        }
        .shortcuts-row::-webkit-scrollbar { display: none; }

        .chip-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 9px 16px; font-family: 'Rajdhani', sans-serif;
            font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--ink-soft); white-space: nowrap; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.25s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        .chip-btn:hover, .chip-btn:active {
            background: var(--cyan-soft);
            border-color: var(--cyan);
            color: var(--ink);
            transform: translateY(-1px);
            box-shadow: 0 0 20px var(--cyan-glow);
        }
        .chip-btn i { color: var(--cyan); }

        .header-controls-bar {
            padding: 8px; display: flex; align-items: center;
            justify-content: space-between; gap: 8px; z-index: 1000;
            border-radius: 12px;
        }

        .mode-selector {
            display: flex; background: rgba(0, 245, 255, 0.04);
            border: 1px solid var(--glass-border); border-radius: 8px; padding: 3px; gap: 3px;
        }
        .mode-btn {
            background: transparent; border: none; color: var(--ink-faint);
            padding: 7px 12px; border-radius: 6px;
            font-family: 'Rajdhani', sans-serif; font-size: 10px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
            transition: all 0.25s ease; display: flex; align-items: center; gap: 6px;
        }
        .mode-btn.active {
            background: var(--magenta-soft);
            color: var(--magenta);
            box-shadow: inset 0 0 0 1px var(--magenta), 0 0 15px var(--magenta-glow);
        }

        .toll-toggle-btn {
            background: transparent; border: 1px solid var(--glass-border);
            color: var(--ink-soft); padding: 9px 16px; border-radius: 8px;
            font-family: 'Rajdhani', sans-serif; font-size: 10px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; gap: 7px; transition: all 0.25s ease;
        }
        .toll-toggle-btn:hover { border-color: var(--cyan); color: var(--ink); background: rgba(0,245,255,0.04); }
        .toll-toggle-btn.active {
            background: var(--cyan-soft);
            color: var(--cyan);
            border-color: var(--cyan);
            box-shadow: 0 0 18px var(--cyan-glow);
        }

        .ultron-voice-btn {
            background: transparent; border: 1px solid var(--glass-border);
            color: var(--ink-soft); padding: 9px 16px; border-radius: 8px;
            font-family: 'Rajdhani', sans-serif; font-size: 10px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; gap: 7px; transition: all 0.25s ease; position: relative;
        }
        .ultron-voice-btn.active {
            background: var(--magenta-soft);
            color: var(--magenta);
            border-color: var(--magenta);
            box-shadow: 0 0 18px var(--magenta-glow);
        }
        .ultron-voice-btn.speaking { animation: voicePulse 0.7s infinite alternate; }
        @keyframes voicePulse {
            0% { box-shadow: 0 0 0 0 var(--magenta-glow); }
            100% { box-shadow: 0 0 20px var(--magenta-glow); }
        }

        .turn-banner {
            position: absolute; top: calc(env(safe-area-inset-top, 0px) + 160px);
            left: 14px; right: 14px; z-index: 999; padding: 16px 20px;
            display: none; align-items: center; gap: 16px;
            background: var(--glass-bg-deep);
            backdrop-filter: blur(45px) saturate(200%); -webkit-backdrop-filter: blur(45px) saturate(200%);
            border: 1px solid var(--magenta); border-radius: 12px;
            box-shadow: 0 0 40px var(--magenta-glow), 0 30px 90px rgba(0,0,0,0.9);
            animation: bannerSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes bannerSlideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .turn-banner.active { display: flex; }

        .turn-icon-box {
            width: 48px; height: 48px; border-radius: 10px;
            background: var(--magenta-soft); border: 1px solid var(--magenta);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: var(--magenta); flex-shrink: 0;
            box-shadow: 0 0 20px var(--magenta-glow);
        }
        .turn-details { flex: 1; min-width: 0; }
        .turn-instruction {
            font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700;
            color: var(--ink); letter-spacing: 0.5px; line-height: 1.35;
            text-transform: uppercase;
        }
        .turn-distance {
            font-family: 'Share Tech Mono', monospace; font-size: 10px; font-weight: 400;
            letter-spacing: 1.8px; text-transform: uppercase; color: var(--cyan); margin-top: 5px;
        }

        .speed-badge {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 245px);
            left: 14px; z-index: 999; padding: 12px 18px;
            display: flex; align-items: center; gap: 12px; border-radius: 12px;
            font-family: 'Share Tech Mono', monospace; font-size: 9px; font-weight: 400;
            letter-spacing: 2px; text-transform: uppercase; color: var(--ink-faint);
        }
        .speed-value {
            font-family: 'Orbitron', sans-serif; font-size: 24px;
            color: var(--cyan); letter-spacing: 0px; font-weight: 700;
            text-shadow: 0 0 16px var(--cyan-glow);
        }
        .speed-badge i { color: var(--magenta); font-size: 14px; }

        .side-controls {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 245px);
            right: 14px; z-index: 999; display: flex; flex-direction: column; gap: 10px;
        }
        .icon-circle-btn {
            width: 44px; height: 44px; border-radius: 12px;
            border: 1px solid var(--glass-border); background: var(--glass-bg);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            color: var(--cyan); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px; transition: all 0.25s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .icon-circle-btn:hover {
            background: var(--cyan-soft); border-color: var(--cyan); color: var(--ink);
            box-shadow: 0 0 22px var(--cyan-glow);
            transform: scale(1.05);
        }

        .recenter-pill {
            position: absolute; left: 50%; transform: translateX(-50%);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 165px); z-index: 1001;
            display: none; align-items: center; gap: 8px; padding: 11px 20px;
            background: var(--glass-bg-deep); color: var(--cyan);
            border: 1px solid var(--cyan); border-radius: 30px; cursor: pointer;
            font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            box-shadow: 0 0 25px var(--cyan-glow), 0 20px 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            transition: all 0.25s ease;
        }
        .recenter-pill.show { display: flex; }
        .recenter-pill:hover { background: var(--cyan-soft); box-shadow: 0 0 35px var(--cyan-glow); }
        .icon-circle-btn.following { color: var(--magenta); border-color: var(--magenta); box-shadow: 0 0 18px var(--magenta-glow); }

        .route-selection-panel {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 155px);
            left: 14px; right: 14px; z-index: 1000; padding: 12px;
            display: none; flex-direction: column; gap: 8px;
            max-height: 40vh; overflow-y: auto; border-radius: 16px;
        }
        .route-selection-panel.active { display: flex; }

        .route-card {
            background: rgba(14, 6, 28, 0.65);
            border: 1px solid var(--glass-border); border-radius: 10px;
            padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.25s ease; gap: 14px;
        }
        .route-card:hover {
            border-color: var(--cyan);
            background: var(--cyan-soft);
            box-shadow: 0 0 22px var(--cyan-glow);
            transform: translateY(-1px);
        }
        .route-card.selected {
            border-color: var(--magenta);
            background: var(--magenta-soft);
            box-shadow: 0 0 22px var(--magenta-glow);
        }
        .route-card-title {
            font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 700;
            display: flex; align-items: center; gap: 10px; color: var(--ink); letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .route-badge {
            font-family: 'Share Tech Mono', monospace; font-size: 8px; font-weight: 400;
            letter-spacing: 1.2px; text-transform: uppercase; padding: 4px 8px;
            border-radius: 6px; border: 1px solid var(--glass-border);
            color: var(--ink-soft); background: transparent;
        }
        .badge-fast { border-color: var(--magenta); color: var(--magenta); background: var(--magenta-soft); }
        .badge-free { border-color: var(--glass-border); color: var(--ink-soft); }
        .badge-toll { border-color: var(--yellow); color: var(--yellow); background: var(--yellow-soft); }
        .badge-notoll { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-soft); }
        .route-card-sub {
            font-family: 'Share Tech Mono', monospace; font-size: 10px; font-weight: 400;
            letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-faint); margin-top: 5px;
        }
        .route-card i { color: var(--ink-faint); font-size: 12px; }
        .route-card.selected i { color: var(--magenta); text-shadow: 0 0 10px var(--magenta-glow); }

        .bottom-bar {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
            left: 14px; right: 14px; z-index: 1000; padding: 14px 18px;
            display: flex; flex-direction: column; gap: 12px; border-radius: 16px;
        }
        .action-buttons { display: flex; gap: 8px; width: 100%; }

        .btn {
            border: 1px solid var(--glass-border); padding: 13px 16px; border-radius: 10px;
            font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft);
            background: var(--glass-bg); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.25s ease; flex: 1; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            background: var(--cyan-soft);
            box-shadow: 0 0 20px var(--cyan-glow);
            transform: translateY(-1px);
        }
        .btn-primary {
            background: var(--magenta);
            color: #05020c;
            border-color: var(--magenta);
            box-shadow: 0 0 25px var(--magenta-glow);
        }
        .btn-primary:hover {
            background: #ff529c;
            color: #05020c;
            box-shadow: 0 0 35px var(--magenta-glow);
        }
        .btn-secondary { background: var(--glass-bg); }
        .btn-danger {
            background: var(--glass-bg);
            border-color: var(--yellow);
            color: var(--yellow);
        }
        .btn-danger:hover {
            background: var(--yellow-soft);
            box-shadow: 0 0 20px rgba(255, 214, 10, 0.5);
        }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; transform: none !important; }

        #routeMetrics {
            font-family: 'Share Tech Mono', monospace; font-size: 10px;
            letter-spacing: 1.8px; text-transform: uppercase; color: var(--ink-faint);
            display: flex; justify-content: space-between; align-items: center;
        }
        #routeMetrics strong { color: var(--cyan); font-weight: 400; text-shadow: 0 0 10px var(--cyan-glow); }

        .user-location-marker { position: relative; width: 32px; height: 32px; }
        .user-dot {
            width: 16px; height: 16px; background: var(--cyan);
            border: 2px solid var(--bg-deep); border-radius: 50%;
            box-shadow: 0 0 0 2px var(--cyan), 0 0 25px var(--cyan), 0 0 40px var(--cyan-glow);
            position: absolute; top: 8px; left: 8px; z-index: 2;
        }
        .user-pulse {
            width: 44px; height: 44px;
            background: radial-gradient(circle, var(--cyan-glow) 0%, transparent 70%);
            border-radius: 50%; position: absolute; top: -6px; left: -6px;
            animation: pulse-ring 2s infinite ease-out;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.3); opacity: 0.95; }
            100% { transform: scale(2); opacity: 0; }
        }
        .dest-pin-icon {
            font-size: 28px; color: var(--magenta);
            filter: drop-shadow(0 0 12px var(--magenta)) drop-shadow(0 0 22px var(--magenta-glow));
        }
        .leaflet-routing-container { display: none !important; }

        .toast-msg {
            position: absolute; top: calc(env(safe-area-inset-top, 0px) + 64px);
            left: 50%; transform: translateX(-50%) translateY(-10px);
            background: var(--glass-bg-deep); backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border: 1px solid var(--cyan); color: var(--cyan);
            padding: 11px 22px; border-radius: 30px;
            font-family: 'Share Tech Mono', monospace; font-size: 10px; font-weight: 400;
            letter-spacing: 1.8px; text-transform: uppercase;
            z-index: 5000; opacity: 0; pointer-events: none; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 30px var(--cyan-glow), 0 20px 60px rgba(0,0,0,0.9); white-space: nowrap;
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .tab-bar {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
            left: 14px; right: 14px; z-index: 1100;
            display: flex; align-items: center; justify-content: space-around;
            padding: 10px; border-radius: 16px;
        }
        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
            background: transparent; border: none; color: var(--ink-faint);
            padding: 8px 0; font-family: 'Share Tech Mono', monospace;
            font-size: 9px; font-weight: 400; letter-spacing: 1.8px; text-transform: uppercase;

            </div>

                <div>
                    <div class="label">Purge Data</div>
                    <div class="sub">Wipe recents, saved, home</div>

            </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        let map, userMarker, accuracyCircle, userCoords = null;
        let activeDestination = null, destMarker = null;
        let watchId = null, simInterval = null;
        let isNavigating = false, isSimulating = false, isTrackingCamera = true;
        let ultronEnabled = true, avoidTolls = false, synth = window.speechSynthesis, audioCtx = null;
        let nextStepIdx = 1, announced300 = -1, simSpeedKmh = 0;
        let autoZooming = false, manualZoomUntil = 0, lastNavZoom = 17, autoRecenterTimer = null;
        let robotVoice = null;
        let travelMode = 'car';

        let routesList = [];
        let selectedRouteIndex = 0;
        let currentRoutePolylines = [];
        let activeRouteCoordinates = [];
        let activeRouteInstructions = [];
        let lastSpokenInstructionIndex = -1;
        let debounceTimer = null;

        let recents = JSON.parse(localStorage.getItem('raon_recents') || '[]');
        let savedPlaces = JSON.parse(localStorage.getItem('raon_saved') || '[]');
        let homeLocation = JSON.parse(localStorage.getItem('raon_home') || 'null');

        const DEFAULT_LOCATION = [1.4927, 103.7414];

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            initAudioContext();
            pickRobotVoice();
            if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickRobotVoice;
            requestLocationWithSafariFallback();
            updateHomeSubLabel();
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false, zoomSnap: 0.5, zoomDelta: 1 }).setView(DEFAULT_LOCATION, 15);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            map.on('click', (e) => {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if (!userCoords) requestLocationWithSafariFallback();
                setDestination(e.latlng);
            });
            map.on('dragstart', () => {
                isTrackingCamera = false;
                updateRecenterUI();
                if (isNavigating) {
                    clearTimeout(autoRecenterTimer);
                    autoRecenterTimer = setTimeout(() => { if (isNavigating) recenterUser(); }, 10000);
                }
            });
            map.on('zoomend', () => {
                if (autoZooming) { autoZooming = false; return; }
                if (isNavigating) manualZoomUntil = Date.now() + 8000;
            });
        }

        function initAudioContext() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AC();
            } catch(e) {}
        }

        function playUltronMetallicPulse() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gain = audioCtx.createGain();
                osc1.type = 'sawtooth'; osc2.type = 'square';
                osc1.frequency.setValueAtTime(85, audioCtx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.25);
                osc2.frequency.setValueAtTime(170, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.25);
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                filter.Q.setValueAtTime(4, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc1.connect(filter); osc2.connect(filter);
                filter.connect(gain); gain.connect(audioCtx.destination);
                osc1.start(); osc2.start();
                osc1.stop(audioCtx.currentTime + 0.3);
                osc2.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        const MALE_VOICE_HINTS = ['fred', 'google uk english male', 'microsoft guy', 'microsoft david', 'microsoft mark',
                                  'david', 'mark', 'daniel', 'alex', 'tom', 'aaron', 'arthur', 'ralph', 'rishi', 'male'];
        const FEMALE_VOICE_HINTS = ['zira', 'female', 'samantha', 'victoria', 'karen', 'susan', 'hazel', 'aria', 'jenny',
                                    'moira', 'tessa', 'fiona', 'allison', 'ava', 'serena', 'kate', 'siri'];
        function pickRobotVoice() {
            if (!synth) return;
            const voices = synth.getVoices() || [];
            const en = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
            const notFemale = en.filter(v => !FEMALE_VOICE_HINTS.some(h => v.name.toLowerCase().includes(h)));
            for (const hint of MALE_VOICE_HINTS) {
                const m = notFemale.find(v => v.name.toLowerCase().includes(hint));
                if (m) { robotVoice = m; return; }
            }
            robotVoice = notFemale[0] || en[0] || voices[0] || null;
        }

        function speakUltron(text) {
            if (!ultronEnabled || !('speechSynthesis' in window)) return;
            synth.cancel();
            playUltronMetallicPulse();
            const btn = document.getElementById('ultronVoiceBtn');
            btn.classList.add('speaking');
            setTimeout(() => {
                const robotText = String(text).replace(/,\s*/g, '. ');
                const utterance = new SpeechSynthesisUtterance(robotText);
                if (!robotVoice) pickRobotVoice();
                if (robotVoice) { utterance.voice = robotVoice; utterance.lang = robotVoice.lang; }
                utterance.pitch = 0.1;
                utterance.rate = 0.88;
                utterance.volume = 1.0;
                utterance.onend = () => btn.classList.remove('speaking');
                utterance.onerror = () => btn.classList.remove('speaking');
                synth.speak(utterance);
            }, 140);
        }

        function requestLocationWithSafariFallback() {
            if (!("geolocation" in navigator)) {
                userCoords = L.latLng(DEFAULT_LOCATION);
                updateUserMarker(userCoords, 100);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userCoords = L.latLng(pos.coords.latitude, pos.coords.longitude);
                    updateUserMarker(userCoords, pos.coords.accuracy || 20);
                    if (isTrackingCamera) map.setView(userCoords, 16);
                    startGPSWatch();
                },
                () => {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            userCoords = L.latLng(pos.coords.latitude, pos.coords.longitude);
                            updateUserMarker(userCoords, pos.coords.accuracy || 100);
                            if (isTrackingCamera) map.setView(userCoords, 15);
                            startGPSWatch();
                        },
                        () => {
                            if (!userCoords) {
                                userCoords = L.latLng(DEFAULT_LOCATION);
                                updateUserMarker(userCoords, 100);
                                showToast("// USING DEFAULT COORDS");
                            }
                        },
                        { enableHighAccuracy: false, timeout: 6000 }
                    );
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 10000 }
            );
        }

        function startGPSWatch() {
            if (watchId !== null) return;
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    userCoords = L.latLng(pos.coords.latitude, pos.coords.longitude);
                    const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
                    document.getElementById('speedValue').innerText = speed;
                    updateUserMarker(userCoords, pos.coords.accuracy || 20);
                    if (isNavigating) {
                        simSpeedKmh = speed;
                        followCamera();
                        checkManeuverProximity();
                    } else if (isTrackingCamera) {
                        map.panTo(userCoords, { animate: true });
                    }
                },
                () => {},
                { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
            );
        }

        function updateUserMarker(coords, accuracy) {
            if (userMarker) {
                userMarker.setLatLng(coords);
                accuracyCircle.setLatLng(coords);
                accuracyCircle.setRadius(accuracy);
            } else {
                const icon = L.divIcon({
                    className: 'user-location-marker',
                    html: `<div class="user-pulse"></div><div class="user-dot"></div>`,
                    iconSize: [32, 32], iconAnchor: [16, 16]
                });
                userMarker = L.marker(coords, { icon }).addTo(map);
                accuracyCircle = L.circle(coords, { radius: accuracy, color: '#00f5ff', fillColor: '#00f5ff', fillOpacity: 0.05, weight: 0.5 }).addTo(map);
            }
        }

        function recenterUser() {
            isTrackingCamera = true;
            clearTimeout(autoRecenterTimer);
            manualZoomUntil = 0;
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (userCoords) {
                const targetZoom = isNavigating ? computeNavZoom() : 16;
                if (isNavigating) { lastNavZoom = targetZoom; autoZooming = (map.getZoom() !== targetZoom); }
                map.flyTo(userCoords, targetZoom, { animate: true, duration: 0.8 });
            } else {
                requestLocationWithSafariFallback();
            }
            updateRecenterUI();
        }

        function updateRecenterUI() {
            const pill = document.getElementById('recenterPill');
            const btn = document.getElementById('recenterBtn');
            if (pill) pill.classList.toggle('show', isNavigating && !isTrackingCamera);
            if (btn) btn.classList.toggle('following', isTrackingCamera);
        }

        function zoomBy(delta) {
            manualZoomUntil = Date.now() + 8000;
            map.setZoom(Math.max(3, Math.min(19, map.getZoom() + delta)));
        }

        function computeNavZoom() {
            let z = 17;
            const v = simSpeedKmh || 0;
            if (v > 90) z = 15.5;
            else if (v > 60) z = 16;
            else if (v > 35) z = 16.5;
            if (userCoords && activeRouteInstructions[nextStepIdx]) {
                const s = activeRouteInstructions[nextStepIdx];
                const d = userCoords.distanceTo(L.latLng(s.maneuver.location[1], s.maneuver.location[0]));
                if (d < 120) z = Math.max(z, 18);
                else if (d < 300) z = Math.max(z, 17.5);
            }
            return z;
        }

        function followCamera() {
            if (!isTrackingCamera || !userCoords) return;
            let z = map.getZoom();
            if (Date.now() > manualZoomUntil) {
                const target = computeNavZoom();
                if (Math.abs(target - z) >= 0.5) { autoZooming = true; z = target; lastNavZoom = target; }
            }
            map.setView(userCoords, z, { animate: true, duration: 0.8 });
        }

        function handleSearchInput(query) {
            const clearBtn = document.getElementById('searchClearBtn');
            clearBtn.style.display = query ? 'block' : 'none';
            clearTimeout(debounceTimer);
            if (!query || query.trim().length < 2) {
                document.getElementById('searchResults').classList.remove('active');
                return;
            }
            debounceTimer = setTimeout(() => {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;
                fetch(url).then(r => r.json()).then(data => renderSearchResults(data)).catch(() => {});
            }, 300);
        }

        function renderSearchResults(results) {
            const dropdown = document.getElementById('searchResults');
            dropdown.innerHTML = '';
            if (results.length === 0) { dropdown.classList.remove('active'); return; }
            results.forEach(res => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `<i class="fa-solid fa-location-dot"></i> <span>${res.display_name}</span>`;
                item.onclick = () => {
                    const latLng = L.latLng(parseFloat(res.lat), parseFloat(res.lon));
                    const name = res.display_name.split(',')[0];
                    setDestination(latLng, name);
                    dropdown.classList.remove('active');
                    document.getElementById('searchInput').value = name;
                    addRecent({ name, lat: latLng.lat, lng: latLng.lng });
                };
                dropdown.appendChild(item);
            });
            dropdown.classList.add('active');
        }

        function searchCategory(cat) {
            if (!userCoords) return;
            document.getElementById('searchInput').value = cat;
            handleSearchInput(`${cat} near ${userCoords.lat},${userCoords.lng}`);
        }

        function clearSearchInput() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClearBtn').style.display = 'none';
            document.getElementById('searchResults').classList.remove('active');
        }

        function setDestination(latLng, label = "TARGET") {
            activeDestination = latLng;
            if (!userCoords) { userCoords = L.latLng(DEFAULT_LOCATION); updateUserMarker(userCoords, 100); }
            if (destMarker) map.removeLayer(destMarker);
            const pinIcon = L.divIcon({
                className: 'dest-pin',
                html: `<i class="fa-solid fa-location-dot dest-pin-icon"></i>`,
                iconSize: [32, 32], iconAnchor: [16, 32]
            });
            destMarker = L.marker(activeDestination, { icon: pinIcon }).addTo(map);
            calculateRoutes(label);
        }

        function calculateRoutes(label) {
            clearPolylines();
            const panel = document.getElementById('routeSelectionPanel');
            const container = document.getElementById('routeCardsContainer');
            panel.classList.add('active');
            container.innerHTML = `<div class="route-loading"><div class="spinner"></div> CALCULATING...</div>`;

            const base = `https://router.project-osrm.org/route/v1/driving/${userCoords.lng},${userCoords.lat};${activeDestination.lng},${activeDestination.lat}?alternatives=true&overview=full&geometries=geojson&steps=true`;

            /* FIXED PRECISE TOLL DETECTION:
               Only check OSRM step intersection classes array for explicit "toll" tag.
               Avoids all false positives from matching substrings like 'tol' or general highway names.
            */
            const detectToll = (r) => {
                const steps = (r.legs || []).flatMap(l => l.steps || []);
                return steps.some(step => {
                    const intersections = step.intersections || [];
                    return intersections.some(i => {
                        const classes = i.classes || [];
                        return classes.includes('toll');
                    });
                });
            };

            const fetchRoutes = (url) => fetch(url).then(r => r.json());

            const first = avoidTolls ? fetchRoutes(base + '&exclude=toll').catch(() => null) : fetchRoutes(base);

            first
                .then(data => {
                    if (avoidTolls && (!data || data.code !== 'Ok' || !data.routes || !data.routes.length)) {
                        return fetchRoutes(base);
                    }
                    return data;
                })
                .then(data => {
                    if (data.routes && data.routes.length > 0) {
                        let all = data.routes.map(r => ({ ...r, hasToll: detectToll(r) }));
                        if (avoidTolls) {
                            const free = all.filter(r => !r.hasToll);
                            if (free.length > 0) all = free;
                            else showToast("// NO TOLL-FREE ROUTE FOUND");
                        }
                        routesList = all;
                        selectedRouteIndex = 0;
                        renderRouteCards(label);
                        selectRoute(0);
                        enableActionButtons();
                        speakUltron("Route calculated.");
                    } else {
                        container.innerHTML = `<div class="empty-state">NO ROUTE FOUND</div>`;
                    }
                })
                .catch(() => {
                    container.innerHTML = `<div class="empty-state">ROUTING ERROR</div>`;
                });
        }

        function renderRouteCards(label) {
            const container = document.getElementById('routeCardsContainer');
            container.innerHTML = '';
            routesList.forEach((r, idx) => {
                const mins = Math.round(r.duration / 60);
                const km = (r.distance / 1000).toFixed(1);
                let primaryBadge = idx === 0 ? '<span class="route-badge badge-fast">FAST</span>' : '<span class="route-badge badge-free">ALT</span>';
                let tollBadge = r.hasToll
                    ? '<span class="route-badge badge-toll"><i class="fa-solid fa-receipt"></i> TOLL</span>'
                    : '<span class="route-badge badge-notoll"><i class="fa-solid fa-shield-halved"></i> FREE</span>';

                const card = document.createElement('div');
                card.className = `route-card ${idx === selectedRouteIndex ? 'selected' : ''}`;
                card.id = `routeCard-${idx}`;
                card.onclick = () => selectRoute(idx);
                card.innerHTML = `
                    <div>
                        <div class="route-card-title">
                            <span>${label}</span>
                            ${primaryBadge}
                            ${tollBadge}
                        </div>
                        <div class="route-card-sub">${mins} MIN · ${km} KM</div>
                    </div>
                    <i class="fa-solid ${idx === selectedRouteIndex ? 'fa-check' : 'fa-circle'}" id="checkRoute-${idx}" style="font-size:10px;"></i>
                `;
                container.appendChild(card);
            });
        }

        function selectRoute(idx) {
            selectedRouteIndex = idx;
            routesList.forEach((_, i) => {
                const card = document.getElementById(`routeCard-${i}`);
                const icon = document.getElementById(`checkRoute-${i}`);
                if (card && icon) {
                    card.classList.toggle('selected', i === idx);
                    icon.className = i === idx ? 'fa-solid fa-check' : 'fa-solid fa-circle';
                    icon.style.fontSize = '10px';
                }
            });
            renderRouteOnMap(routesList[idx]);
        }

        function toggleAvoidTolls() {
            avoidTolls = !avoidTolls;
            const btn = document.getElementById('tollToggleBtn');
            const label = document.getElementById('tollBtnLabel');
            const settingsToggle = document.getElementById('settingsTollToggle');
            btn.classList.toggle('active', avoidTolls);
            settingsToggle.classList.toggle('on', avoidTolls);
            label.innerText = avoidTolls ? "NO TOLL" : "TOLLS";
            showToast(avoidTolls ? "// AVOIDING TOLLS" : "// TOLLS ALLOWED");
            if (activeDestination) calculateRoutes("TARGET");
        }

        function renderRouteOnMap(routeData) {
            clearPolylines();
            activeRouteCoordinates = routeData.geometry.coordinates.map(c => [c[1], c[0]]);
            activeRouteInstructions = routeData.legs[0].steps;

            const totalPoints = activeRouteCoordinates.length;
            if (totalPoints > 1) {
                const clearEnd = Math.floor(totalPoints * 0.55);
                const jamEnd = Math.floor(totalPoints * 0.85);

                const clearSegment = activeRouteCoordinates.slice(0, clearEnd + 1);
                const moderateSegment = activeRouteCoordinates.slice(clearEnd, jamEnd + 1);
                const jammedSegment = activeRouteCoordinates.slice(jamEnd);

                if (clearSegment.length > 1) {
                    currentRoutePolylines.push(L.polyline(clearSegment, {
                        color: '#00f5ff', weight: 6, opacity: 0.95
                    }).addTo(map));
                }
                if (moderateSegment.length > 1) {
                    currentRoutePolylines.push(L.polyline(moderateSegment, {
                        color: '#ffd60a', weight: 6, opacity: 0.95
                    }).addTo(map));
                }
                if (jammedSegment.length > 1) {
                    currentRoutePolylines.push(L.polyline(jammedSegment, {
                        color: '#ff2a85', weight: 6, opacity: 0.95
                    }).addTo(map));
                }
            }

            map.fitBounds(L.latLngBounds(activeRouteCoordinates), { padding: [60, 60] });
            const mins = Math.round(routeData.duration / 60);
            const km = (routeData.distance / 1000).toFixed(1);
            const tollStatus = routeData.hasToll
                ? `<span style="color:var(--yellow);"><i class="fa-solid fa-receipt"></i> TOLL</span>`
                : `<span style="color:var(--cyan);"><i class="fa-solid fa-shield-halved"></i> FREE</span>`;

            document.getElementById('routeMetrics').innerHTML = `
                <span><strong>ETA</strong> ${mins}M &nbsp; <strong>DIST</strong> ${km}KM</span>
                ${tollStatus}
            `;

            nextStepIdx = Math.min(1, activeRouteInstructions.length - 1); announced300 = -1;
            if (activeRouteInstructions.length > 0) updateTurnBanner(activeRouteInstructions[0]);
        }

        function clearPolylines() {
            currentRoutePolylines.forEach(p => map.removeLayer(p));
            currentRoutePolylines = [];
        }

        function enableActionButtons() {
            document.getElementById('startNavBtn').disabled = false;
            document.getElementById('simDriveBtn').disabled = false;
            document.getElementById('clearBtn').style.display = 'block';
        }

        function buildInstruction(step) {
            const m = step.maneuver || {};
            const mod = m.modifier ? m.modifier.replace('slight ', 'slight ').replace('sharp ', 'sharp ') : '';
            const road = step.name ? ` onto ${step.name}` : '';
            switch (m.type) {
                case 'depart': return `Head ${mod || 'straight'}${step.name ? ' on ' + step.name : ''}`;
                case 'arrive': return 'You have arrived at your destination';
                case 'turn': return `Turn ${mod}${road}`;
                case 'end of road': return `Turn ${mod} at the end of the road${road}`;
                case 'fork': return `Keep ${mod || 'straight'} at the fork${road}`;
                case 'merge': return `Merge ${mod || ''}${road}`.trim();
                case 'on ramp': return `Take the ramp${road}`;
                case 'off ramp': return `Take the exit${road}`;
                case 'roundabout': case 'rotary':
                    return `At the roundabout, take exit ${m.exit || ''}${road}`.replace('exit ', m.exit ? 'exit ' : 'the exit');
                case 'roundabout turn': return `At the roundabout, turn ${mod}${road}`;
                case 'new name': case 'continue': return `Continue ${mod || 'straight'}${step.name ? ' on ' + step.name : ''}`;
                default: return `Continue${road}`;
            }
        }

        function updateTurnBanner(step, liveDist) {
            const banner = document.getElementById('turnBanner');
            banner.classList.add('active');
            const inst = buildInstruction(step);
            const d = (liveDist !== undefined) ? liveDist : step.distance;
            const dist = d > 1000 ? `${(d / 1000).toFixed(1)} KM` : `${Math.round(d)} M`;
            document.getElementById('turnInstruction').innerText = inst.toUpperCase();
            document.getElementById('turnDistance').innerText = (liveDist !== undefined) ? `IN ${dist}` : `NEXT ${dist}`;
        }

        function setTravelMode(mode) {
            travelMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            if (activeDestination) calculateRoutes("TARGET");
        }

        function toggleUltronVoice() {
            ultronEnabled = !ultronEnabled;
            const btn = document.getElementById('ultronVoiceBtn');
            btn.classList.toggle('active', ultronEnabled);
            document.getElementById('settingsVoiceToggle').classList.toggle('on', ultronEnabled);
            if (ultronEnabled) speakUltron("Voice online.");
            else synth.cancel();
        }

        function toggleNavigation() {
            if (isNavigating) {
                stopNavigation();
            } else {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                isNavigating = true;
                isTrackingCamera = true;
                nextStepIdx = Math.min(1, activeRouteInstructions.length - 1); announced300 = -1; manualZoomUntil = 0;
                document.getElementById('startNavBtn').innerHTML = `<i class="fa-solid fa-stop"></i> END`;
                document.getElementById('startNavBtn').className = "btn btn-danger";
                document.getElementById('routeSelectionPanel').classList.remove('active');
                if (userCoords) { autoZooming = true; map.flyTo(userCoords, computeNavZoom(), { animate: true, duration: 1 }); }
                updateRecenterUI();
                speakUltron("Navigation started.");
            }
        }

        function stopNavigation() {
            isNavigating = false;
            clearTimeout(autoRecenterTimer);
            isTrackingCamera = true;
            updateRecenterUI();
            document.getElementById('startNavBtn').innerHTML = `<i class="fa-solid fa-location-arrow"></i> START`;
            document.getElementById('startNavBtn').className = "btn btn-primary";
            document.getElementById('turnBanner').classList.remove('active');
            synth.cancel();
            if (userCoords) map.flyTo(userCoords, 15, { animate: true });
        }

        function checkManeuverProximity() {
            if (!activeRouteInstructions || activeRouteInstructions.length === 0 || !userCoords) return;
            const step = activeRouteInstructions[nextStepIdx];
            if (!step) return;
            const wp = L.latLng(step.maneuver.location[1], step.maneuver.location[0]);
            const dist = userCoords.distanceTo(wp);
            updateTurnBanner(step, dist);

            if (step.maneuver.type === 'arrive') {
                if (dist < 30 && lastSpokenInstructionIndex !== nextStepIdx) {
                    lastSpokenInstructionIndex = nextStepIdx;
                    speakUltron("Destination reached.");
                }
                return;
            }
            if (dist < 320 && dist >= 80 && announced300 !== nextStepIdx) {
                announced300 = nextStepIdx;
                speakUltron(`In ${Math.round(dist / 50) * 50} meters, ${buildInstruction(step)}.`);
            } else if (dist < 40) {
                if (lastSpokenInstructionIndex !== nextStepIdx) {
                    lastSpokenInstructionIndex = nextStepIdx;
                    speakUltron(`${buildInstruction(step)} now.`);
                }
                if (dist < 25 && nextStepIdx < activeRouteInstructions.length - 1) nextStepIdx++;
            }
        }

        function toggleSimulation() {
            if (isSimulating) stopSimulation();
            else startSimulation();
        }

        function startSimulation() {
            if (activeRouteCoordinates.length === 0) return;
            isSimulating = true;
            isNavigating = true;
            document.getElementById('simDriveBtn').innerHTML = `<i class="fa-solid fa-pause"></i> HOLD`;
            document.getElementById('routeSelectionPanel').classList.remove('active');
            let index = 0;
            nextStepIdx = Math.min(1, activeRouteInstructions.length - 1); announced300 = -1; lastSpokenInstructionIndex = -1;
            isTrackingCamera = true; manualZoomUntil = 0;
            updateRecenterUI();
            simInterval = setInterval(() => {
                if (index >= activeRouteCoordinates.length) {
                    stopSimulation();
                    speakUltron("Destination reached.");
                    return;
                }
                const prev = userCoords;
                userCoords = L.latLng(activeRouteCoordinates[index]);
                updateUserMarker(userCoords, 10);
                if (prev) simSpeedKmh = Math.min(120, Math.round((prev.distanceTo(userCoords) / 0.8) * 3.6));
                document.getElementById('speedValue').innerText = simSpeedKmh;
                followCamera();
                checkManeuverProximity();
                index += 2;
            }, 800);
            speakUltron("Simulation started.");
        }

        function stopSimulation() {
            isSimulating = false;
            isNavigating = false;
            clearInterval(simInterval);
            simSpeedKmh = 0;
            updateRecenterUI();
            document.getElementById('simDriveBtn').innerHTML = `<i class="fa-solid fa-play"></i> SIM`;
            document.getElementById('speedValue').innerText = '0';
        }

        function clearActiveRoute() {
            stopNavigation();
            stopSimulation();
            clearPolylines();
            if (destMarker) map.removeLayer(destMarker);
            activeDestination = null;
            routesList = [];
            document.getElementById('routeSelectionPanel').classList.remove('active');
            document.getElementById('startNavBtn').disabled = true;
            document.getElementById('simDriveBtn').disabled = true;
            document.getElementById('clearBtn').style.display = 'none';
            document.getElementById('routeMetrics').innerHTML = `<span>TAP MAP OR SEARCH</span>`;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.overlay-panel').forEach(p => p.classList.remove('active'));
            const btn = document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
            if (btn) btn.classList.add('active');
            if (tabName !== 'map') {
                const panel = document.getElementById(`panel-${tabName}`);
                if (panel) panel.classList.add('active');
                if (tabName === 'recents') renderRecentsList();
                if (tabName === 'saved') renderSavedList();
            }
        }

        function closeTab() {
            document.querySelectorAll('.overlay-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.tab-btn[data-tab="map"]').classList.add('active');
        }

        function addRecent(place) {
            recents = recents.filter(r => r.lat !== place.lat || r.lng !== place.lng);
            recents.unshift(place);
            if (recents.length > 20) recents.pop();
            localStorage.setItem('raon_recents', JSON.stringify(recents));
        }

        function renderRecentsList() {
            const list = document.getElementById('recentsList');
            list.innerHTML = '';
            if (recents.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-clock-rotate-left"></i>NO RECENT TARGETS</div>`;
                return;
            }
            recents.forEach(r => {
                const card = document.createElement('div');
                card.className = 'list-card';
                card.innerHTML = `
                    <div class="list-icon"><i class="fa-solid fa-location-dot"></i></div>
                    <div class="list-main">
                        <div class="list-title">${r.name}</div>
                        <div class="list-sub">${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}</div>
                    </div>
                    <button class="list-action" onclick="event.stopPropagation(); navigateToPlace(${r.lat}, ${r.lng}, '${r.name.replace(/'/g,"\\'")}')">
                        <i class="fa-solid fa-location-arrow"></i>
                    </button>
                `;
                card.onclick = () => { closeTab(); setDestination(L.latLng(r.lat, r.lng), r.name); };
                list.appendChild(card);
            });
        }

        function navigateToPlace(lat, lng, name) {
            closeTab();
            setDestination(L.latLng(lat, lng), name);
        }

        function renderSavedList() {
            const list = document.getElementById('savedList');
            list.innerHTML = '';
            if (savedPlaces.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-bookmark"></i>NO SAVED TARGETS</div>`;
                return;
            }
            savedPlaces.forEach(s => {
                const card = document.createElement('div');
                card.className = 'list-card';
                card.innerHTML = `
                    <div class="list-icon"><i class="fa-solid fa-bookmark"></i></div>
                    <div class="list-main">
                        <div class="list-title">${s.name}</div>
                        <div class="list-sub">${s.lat.toFixed(4)}, ${s.lng.toFixed(4)}</div>
                    </div>
                    <button class="list-action" onclick="event.stopPropagation(); navigateToPlace(${s.lat}, ${s.lng}, '${s.name.replace(/'/g,"\\'")}')">
                        <i class="fa-solid fa-location-arrow"></i>
                    </button>
                `;
                card.onclick = () => { closeTab(); setDestination(L.latLng(s.lat, s.lng), s.name); };
                list.appendChild(card);
            });
        }

        function routeHome() {
            if (!homeLocation) {
                showToast("// HOME SECTOR UNSET");
                switchTab('settings');
                return;
            }
            setDestination(L.latLng(homeLocation.lat, homeLocation.lng), "HOME");
        }

        function promptSetHome() {
            if (!userCoords) { showToast("// AWAITING GPS FIX"); return; }
            homeLocation = { lat: userCoords.lat, lng: userCoords.lng };
            localStorage.setItem('raon_home', JSON.stringify(homeLocation));
            updateHomeSubLabel();
            showToast("// HOME UPDATED");
        }

        function updateHomeSubLabel() {
            const sub = document.getElementById('homeAddressSub');
            if (homeLocation) sub.innerText = `${homeLocation.lat.toFixed(4)}, ${homeLocation.lng.toFixed(4)}`;
            else sub.innerText = "Unset — tap to calibrate";
        }

        function toggleSettingsVoice() { toggleUltronVoice(); }

        function clearAllData() {
            if (confirm("Purge all recents and saved places?")) {
                localStorage.removeItem('raon_recents');
                localStorage.removeItem('raon_saved');
                localStorage.removeItem('raon_home');
                recents = []; savedPlaces = []; homeLocation = null;
                updateHomeSubLabel();
                showToast("// DATA PURGED");
            }
        }

        let recognition = null;
        function toggleVoiceSearch() {
            const micBtn = document.getElementById('micBtn');
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { showToast("// VOICE UNSUPPORTED"); return; }
            if (recognition) { recognition.stop(); recognition = null; micBtn.classList.remove('listening'); return; }
            recognition = new SR();
            recognition.lang = 'en-US';
            recognition.onstart = () => { micBtn.classList.add('listening'); showToast("// LISTENING"); };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('searchInput').value = text;
                handleSearchInput(text);
                micBtn.classList.remove('listening');
            };
            recognition.onerror = () => { micBtn.classList.remove('listening'); };
            recognition.onend = () => { micBtn.classList.remove('listening'); recognition = null; };
            recognition.start();
        }
    </script>
</body>
