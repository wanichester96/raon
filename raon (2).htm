<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>raon // vogue nav</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Vogue Monochrome Glass Palette */
            --bg-deep: #030304;
            --ink: #ffffff;
            --ink-soft: rgba(255, 255, 255, 0.75);
            --ink-faint: rgba(255, 255, 255, 0.4);

            /* Accents */
            --white-glow: rgba(255, 255, 255, 0.5);
            --traffic-jam: #ff3b30;
            --traffic-mod: #ffcc00;
            --traffic-clear: #ffffff;

            /* Glassmorphism */
            --glass-bg: rgba(18, 18, 22, 0.65);
            --glass-bg-deep: rgba(10, 10, 12, 0.88);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-border-strong: rgba(255, 255, 255, 0.45);
            --shadow-vogue: 0 30px 90px rgba(0, 0, 0, 0.95), 0 0 40px rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; width: 100%; overflow: hidden;
            background: var(--bg-deep);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--ink);
            position: relative;
        }

        #map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; background: var(--bg-deep); }

        /* High-contrast Vogue monochrome dark tile filter */
        .vogue-tiles .leaflet-tile {
            filter: brightness(0.65) contrast(1.4) saturate(0) invert(0.92);
        }
        .leaflet-container { background: var(--bg-deep) !important; font-family: inherit; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(36px) saturate(180%);
            -webkit-backdrop-filter: blur(36px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-vogue);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .top-container {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 14px);
            left: 14px; right: 14px;
            z-index: 2000;
            display: flex; flex-direction: column; gap: 10px;
        }

        .search-box-panel {
            padding: 8px;
            display: flex; align-items: center; gap: 10px;
        }

        .search-input-wrapper {
            flex: 1; display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 10px 14px; gap: 12px;
            transition: all 0.3s ease;
        }
        .search-input-wrapper:focus-within {
            border-color: var(--ink);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .search-input-wrapper input {
            background: transparent; border: none; outline: none; color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 14px; width: 100%; font-weight: 400; letter-spacing: 0.5px;
        }
        .search-input-wrapper input::placeholder { color: var(--ink-faint); }

        .mic-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--ink);
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 13px; transition: all 0.3s ease; flex-shrink: 0;
        }
        .mic-btn:hover { border-color: var(--ink); background: rgba(255, 255, 255, 0.15); }
        .mic-btn.listening {
            background: #ffffff; color: #000000; border-color: #ffffff;
            animation: pulseMic 1s infinite alternate;
        }
        @keyframes pulseMic { 0% { opacity: 0.7; } 100% { opacity: 1; box-shadow: 0 0 15px #ffffff; } }

        .search-results-dropdown {
            position: absolute; top: calc(100% + 8px); left: 0; right: 0;
            max-height: 280px; overflow-y: auto;
            display: none; flex-direction: column; z-index: 4000; padding: 6px;
            background: var(--glass-bg-deep);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border-strong);
            box-shadow: var(--shadow-vogue); border-radius: 10px;
        }
        .search-results-dropdown.active { display: flex; }

        .search-item {
            padding: 12px 16px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 12px;
            transition: all 0.2s ease; color: var(--ink-soft);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); border-radius: 6px;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: rgba(255, 255, 255, 0.12); color: var(--ink); }

        .shortcuts-row {
            display: flex; gap: 8px; overflow-x: auto;
            padding-bottom: 2px; scrollbar-width: none;
        }
        .shortcuts-row::-webkit-scrollbar { display: none; }

        .chip-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 9px 16px; font-family: 'Cinzel', serif;
            font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            color: var(--ink-soft); white-space: nowrap; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.25s ease;
        }
        .chip-btn:hover { background: #ffffff; color: #000000; border-color: #ffffff; }

        .header-controls-bar {
            padding: 8px; display: flex; align-items: center;
            justify-content: space-between; gap: 8px; border-radius: 12px;
        }

        .toggle-btn {
            background: transparent; border: 1px solid var(--glass-border);
            color: var(--ink-soft); padding: 8px 14px; border-radius: 8px;
            font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; gap: 7px; transition: all 0.25s ease;
        }
        .toggle-btn:hover, .toggle-btn.active {
            background: #ffffff; color: #000000; border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .turn-banner {
            position: absolute; top: calc(env(safe-area-inset-top, 0px) + 160px);
            left: 14px; right: 14px; z-index: 999; padding: 16px 20px;
            display: none; align-items: center; gap: 16px;
            background: var(--glass-bg-deep);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border-strong); border-radius: 12px;
            box-shadow: var(--shadow-vogue);
        }
        .turn-banner.active { display: flex; }

        .turn-icon-box {
            width: 48px; height: 48px; border-radius: 10px;
            background: #ffffff; color: #000000;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }
        .turn-details { flex: 1; min-width: 0; }
        .turn-instruction {
            font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700;
            color: var(--ink); letter-spacing: 1px; text-transform: uppercase;
        }
        .turn-distance {
            font-family: 'Share Tech Mono', monospace; font-size: 11px;
            letter-spacing: 1.5px; color: var(--ink-faint); margin-top: 4px;
        }

        .speed-badge {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 240px);
            left: 14px; z-index: 999; padding: 12px 18px;
            display: flex; align-items: center; gap: 12px; border-radius: 12px;
            font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--ink-faint);
        }
        .speed-value {
            font-family: 'Cinzel', serif; font-size: 24px;
            color: var(--ink); font-weight: 700;
        }

        .side-controls {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 240px);
            right: 14px; z-index: 999; display: flex; flex-direction: column; gap: 10px;
        }
        .icon-btn {
            width: 44px; height: 44px; border-radius: 12px;
            border: 1px solid var(--glass-border); background: var(--glass-bg);
            color: var(--ink); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px; transition: all 0.25s ease;
        }
        .icon-btn:hover { background: #ffffff; color: #000000; border-color: #ffffff; }

        .recenter-pill {
            position: absolute; left: 50%; transform: translateX(-50%);
            bottom: calc(env(safe-area-inset-bottom, 0px) + 165px); z-index: 1001;
            display: none; align-items: center; gap: 8px; padding: 11px 22px;
            background: #ffffff; color: #000000; border: none; border-radius: 30px; cursor: pointer;
            font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }
        .recenter-pill.show { display: flex; }

        .route-selection-panel {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 155px);
            left: 14px; right: 14px; z-index: 1000; padding: 12px;
            display: none; flex-direction: column; gap: 8px; max-height: 40vh; overflow-y: auto;
        }
        .route-selection-panel.active { display: flex; }

        .route-card {
            background: rgba(20, 20, 25, 0.65);
            border: 1px solid var(--glass-border); border-radius: 10px;
            padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.25s ease;
        }
        .route-card:hover, .route-card.selected {
            border-color: #ffffff; background: rgba(255, 255, 255, 0.12);
        }

        .bottom-bar {
            position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
            left: 14px; right: 14px; z-index: 1000; padding: 14px 18px;
            display: flex; flex-direction: column; gap: 12px; border-radius: 16px;
        }
        .action-buttons { display: flex; gap: 8px; width: 100%; }

        .btn {
            border: 1px solid var(--glass-border); padding: 13px 16px; border-radius: 10px;
            font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft);
            background: var(--glass-bg); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.25s ease; flex: 1;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.15); color: #ffffff; border-color: #ffffff; }
        .btn-primary { background: #ffffff; color: #000000; border-color: #ffffff; }
        .btn-primary:hover { background: #e0e0e0; color: #000000; }
        .btn-danger { border-color: var(--traffic-jam); color: var(--traffic-jam); }
        .btn-danger:hover { background: var(--traffic-jam); color: #ffffff; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }

        #routeMetrics {
            font-family: 'Share Tech Mono', monospace; font-size: 10px;
            letter-spacing: 1.8px; text-transform: uppercase; color: var(--ink-faint);
            display: flex; justify-content: space-between; align-items: center;
        }
        #routeMetrics strong { color: var(--ink); font-weight: 700; }

        .user-location-marker { position: relative; width: 32px; height: 32px; }
        .user-dot {
            width: 16px; height: 16px; background: #ffffff;
            border: 2px solid var(--bg-deep); border-radius: 50%;
            box-shadow: 0 0 0 2px #ffffff, 0 0 25px #ffffff;
            position: absolute; top: 8px; left: 8px; z-index: 2;
        }

        .dest-pin-icon { font-size: 28px; color: #ffffff; filter: drop-shadow(0 0 10px #ffffff); }
        .toll-marker-icon {
            font-size: 18px; color: #000000; background: #ffffff;
            padding: 5px 8px; border-radius: 6px; font-family: 'Cinzel', serif;
            font-weight: 900; box-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        .toast-msg {
            position: absolute; top: calc(env(safe-area-inset-top, 0px) + 64px);
            left: 50%; transform: translateX(-50%) translateY(-10px);
            background: var(--glass-bg-deep); backdrop-filter: blur(35px);
            border: 1px solid #ffffff; color: #ffffff;
            padding: 11px 22px; border-radius: 30px;
            font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
            letter-spacing: 1.8px; text-transform: uppercase;
            z-index: 5000; opacity: 0; pointer-events: none; transition: all 0.35s ease;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3); white-space: nowrap;
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="vogue-tiles">

    <div id="toast" class="toast-msg">// SYSTEM ONLINE</div>

    <div class="top-container">
        <div class="glass-panel search-box-panel">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--ink); font-size: 13px;"></i>
                <input type="text" id="searchInput" placeholder="ENTER DESTINATION..." oninput="handleSearchInput(this.value)">
                <i class="fa-solid fa-xmark" id="searchClearBtn" style="cursor: pointer; display: none; color: var(--ink-faint);" onclick="clearSearchInput()"></i>
                <button class="mic-btn" id="micBtn" onclick="toggleVoiceSearch()" title="Voice Search"><i class="fa-solid fa-microphone"></i></button>
            </div>
            <div class="search-results-dropdown" id="searchResults"></div>
        </div>

        <div class="shortcuts-row">
            <button class="chip-btn" onclick="searchCategory('Gas Station')"><i class="fa-solid fa-gas-pump"></i> FUEL</button>
            <button class="chip-btn" onclick="searchCategory('Parking')"><i class="fa-solid fa-square-parking"></i> PARK</button>
            <button class="chip-btn" onclick="searchCategory('Coffee Shop')"><i class="fa-solid fa-mug-hot"></i> CAFE</button>
            <button class="chip-btn" onclick="searchCategory('Restaurant')"><i class="fa-solid fa-utensils"></i> FOOD</button>
        </div>

        <div class="glass-panel header-controls-bar">
            <button class="toggle-btn" id="trafficToggleBtn" onclick="toggleTrafficLayer()">
                <i class="fa-solid fa-car-side"></i> <span id="trafficBtnLabel">TRAFFIC</span>
            </button>
            <button class="toggle-btn" id="tollToggleBtn" onclick="toggleAvoidTolls()">
                <i class="fa-solid fa-road-barrier"></i> <span id="tollBtnLabel">TOLLS</span>
            </button>
            <button class="toggle-btn active" id="voiceToggleBtn" onclick="toggleVoice()">
                <i class="fa-solid fa-volume-high"></i> <span>VOICE</span>
            </button>
        </div>
    </div>

    <div class="turn-banner" id="turnBanner">
        <div class="turn-icon-box" id="turnIcon"><i class="fa-solid fa-arrow-up"></i></div>
        <div class="turn-details">
            <div class="turn-instruction" id="turnInstruction">AWAITING TARGET</div>
            <div class="turn-distance" id="turnDistance">CALCULATING ROUTE</div>
        </div>
    </div>

    <div class="speed-badge glass-panel">
        <i class="fa-solid fa-gauge-high"></i>
        <span class="speed-value" id="speedValue">0</span>
        <span>KM/H</span>
    </div>

    <div class="side-controls">
        <button class="icon-btn" onclick="zoomBy(1)"><i class="fa-solid fa-plus"></i></button>
        <button class="icon-btn" onclick="zoomBy(-1)"><i class="fa-solid fa-minus"></i></button>
        <button class="icon-btn" id="recenterBtn" onclick="recenterUser()"><i class="fa-solid fa-crosshairs"></i></button>
    </div>

    <button class="recenter-pill" id="recenterPill" onclick="recenterUser()">
        <i class="fa-solid fa-location-crosshairs"></i> RE-CENTRE
    </button>

    <div class="glass-panel route-selection-panel" id="routeSelectionPanel">
        <div style="font-family:'Cinzel',serif; font-size:10px; font-weight:700; letter-spacing:2px; color:var(--ink); padding: 4px 6px 8px;">
            // ROUTE OPTIONS
        </div>
        <div id="routeCardsContainer"></div>
    </div>

    <div id="map"></div>

    <div class="bottom-bar glass-panel">
        <div id="routeMetrics">
            <span>SELECT DESTINATION</span>
        </div>
        <div class="action-buttons">
            <button class="btn btn-primary" id="startNavBtn" onclick="toggleNavigation()" disabled>
                <i class="fa-solid fa-location-arrow"></i> START
            </button>
            <button class="btn" id="simDriveBtn" onclick="toggleSimulation()" disabled>
                <i class="fa-solid fa-play"></i> SIM
            </button>
            <button class="btn btn-danger" id="clearBtn" onclick="clearActiveRoute()" style="display:none;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script>
        let map, userMarker, accuracyCircle, userCoords = null;
        let activeDestination = null, destMarker = null;
        let watchId = null, simInterval = null;
        let isNavigating = false, isSimulating = false, isTrackingCamera = true;
        let voiceEnabled = true, avoidTolls = false, showTraffic = true;
        let synth = window.speechSynthesis;
        let maleVoice = null;

        let routesList = [];
        let selectedRouteIndex = 0;
        let currentRoutePolylines = [];
        let tollMarkers = [];
        let activeRouteCoordinates = [];
        let activeRouteInstructions = [];
        let nextStepIdx = 1, simSpeedKmh = 0;
        let debounceTimer = null;

        const DEFAULT_LOCATION = [1.4927, 103.7414];

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            pickMaleVoice();
            if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickMaleVoice;
            requestLocation();
        });

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(DEFAULT_LOCATION, 15);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            map.on('click', (e) => setDestination(e.latlng));
        }

        function pickMaleVoice() {
            if (!synth) return;
            const voices = synth.getVoices() || [];
            const maleHints = ['google uk english male', 'david', 'alex', 'daniel', 'male', 'guy', 'mark'];
            const enVoices = voices.filter(v => v.lang && v.lang.startsWith('en'));
            for (let hint of maleHints) {
                let match = enVoices.find(v => v.name.toLowerCase().includes(hint));
                if (match) { maleVoice = match; return; }
            }
            maleVoice = enVoices[0] || voices[0] || null;
        }

        function speak(text) {
            if (!voiceEnabled || !synth) return;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            if (!maleVoice) pickMaleVoice();
            if (maleVoice) utterance.voice = maleVoice;
            utterance.pitch = 0.85; // Clean natural male pitch
            utterance.rate = 0.95;
            synth.speak(utterance);
        }

        function requestLocation() {
            if (!("geolocation" in navigator)) {
                userCoords = L.latLng(DEFAULT_LOCATION);
                updateUserMarker(userCoords);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userCoords = L.latLng(pos.coords.latitude, pos.coords.longitude);
                    updateUserMarker(userCoords);
                    if (isTrackingCamera) map.setView(userCoords, 16);
                },
                () => {
                    userCoords = L.latLng(DEFAULT_LOCATION);
                    updateUserMarker(userCoords);
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        function updateUserMarker(coords) {
            if (userMarker) {
                userMarker.setLatLng(coords);
            } else {
                const icon = L.divIcon({
                    className: 'user-location-marker',
                    html: `<div class="user-dot"></div>`,
                    iconSize: [32, 32], iconAnchor: [16, 16]
                });
                userMarker = L.marker(coords, { icon }).addTo(map);
            }
        }

        function recenterUser() {
            isTrackingCamera = true;
            if (userCoords) map.flyTo(userCoords, isNavigating ? 17 : 16, { animate: true });
        }

        function zoomBy(delta) { map.setZoom(map.getZoom() + delta); }

        function handleSearchInput(query) {
            document.getElementById('searchClearBtn').style.display = query ? 'block' : 'none';
            clearTimeout(debounceTimer);
            if (!query || query.trim().length < 2) {
                document.getElementById('searchResults').classList.remove('active');
                return;
            }
            debounceTimer = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`)
                    .then(r => r.json()).then(data => renderSearchResults(data)).catch(() => {});
            }, 300);
        }

        function renderSearchResults(results) {
            const dropdown = document.getElementById('searchResults');
            dropdown.innerHTML = '';
            if (results.length === 0) { dropdown.classList.remove('active'); return; }
            results.forEach(res => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `<i class="fa-solid fa-location-dot"></i> <span>${res.display_name}</span>`;
                item.onclick = () => {
                    setDestination(L.latLng(parseFloat(res.lat), parseFloat(res.lon)), res.display_name.split(',')[0]);
                    dropdown.classList.remove('active');
                };
                dropdown.appendChild(item);
            });
            dropdown.classList.add('active');
        }

        function searchCategory(cat) {
            if (!userCoords) return;
            handleSearchInput(`${cat} near ${userCoords.lat},${userCoords.lng}`);
        }

        function clearSearchInput() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClearBtn').style.display = 'none';
            document.getElementById('searchResults').classList.remove('active');
        }

        function setDestination(latLng, label = "TARGET") {
            activeDestination = latLng;
            if (!userCoords) userCoords = L.latLng(DEFAULT_LOCATION);
            if (destMarker) map.removeLayer(destMarker);
            const pinIcon = L.divIcon({
                className: 'dest-pin',
                html: `<i class="fa-solid fa-location-dot dest-pin-icon"></i>`,
                iconSize: [32, 32], iconAnchor: [16, 32]
            });
            destMarker = L.marker(activeDestination, { icon: pinIcon }).addTo(map);
            calculateRoutes(label);
        }

        function calculateRoutes(label) {
            clearPolylines();
            clearTollMarkers();
            const panel = document.getElementById('routeSelectionPanel');
            const container = document.getElementById('routeCardsContainer');
            panel.classList.add('active');
            container.innerHTML = `<div style="padding:15px; color:var(--ink-faint);">CALCULATING ROUTE...</div>`;

            let url = `https://router.project-osrm.org/route/v1/driving/${userCoords.lng},${userCoords.lat};${activeDestination.lng},${activeDestination.lat}?alternatives=true&overview=full&geometries=geojson&steps=true`;
            if (avoidTolls) url += '&exclude=toll';

            fetch(url).then(r => r.json()).then(data => {
                if (data.routes && data.routes.length > 0) {
                    routesList = data.routes.map(r => ({
                        ...r,
                        hasToll: (r.legs[0].steps || []).some(s => (s.intersections || []).some(i => (i.classes || []).includes('toll')))
                    }));
                    selectedRouteIndex = 0;
                    renderRouteCards(label);
                    selectRoute(0);
                    document.getElementById('startNavBtn').disabled = false;
                    document.getElementById('simDriveBtn').disabled = false;
                    document.getElementById('clearBtn').style.display = 'block';
                    speak("Route calculated.");
                }
            });
        }

        function renderRouteCards(label) {
            const container = document.getElementById('routeCardsContainer');
            container.innerHTML = '';
            routesList.forEach((r, idx) => {
                const mins = Math.round(r.duration / 60);
                const km = (r.distance / 1000).toFixed(1);
                const card = document.createElement('div');
                card.className = `route-card ${idx === selectedRouteIndex ? 'selected' : ''}`;
                card.onclick = () => selectRoute(idx);
                card.innerHTML = `
                    <div>
                        <div style="font-weight:700;">${label} ${idx === 0 ? '(FASTEST)' : '(ALT)'}</div>
                        <div style="font-size:11px; color:var(--ink-faint); margin-top:4px;">${mins} MINS · ${km} KM ${r.hasToll ? '· TOLL' : ''}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectRoute(idx) {
            selectedRouteIndex = idx;
            renderRouteOnMap(routesList[idx]);
        }

        function renderRouteOnMap(routeData) {
            clearPolylines();
            clearTollMarkers();
            activeRouteCoordinates = routeData.geometry.coordinates.map(c => [c[1], c[0]]);
            activeRouteInstructions = routeData.legs[0].steps;

            // Render Traffic Color Segments
            const pts = activeRouteCoordinates;
            if (showTraffic && pts.length > 1) {
                const split = Math.floor(pts.length * 0.7);
                currentRoutePolylines.push(L.polyline(pts.slice(0, split + 1), { color: '#ffffff', weight: 6 }).addTo(map));
                currentRoutePolylines.push(L.polyline(pts.slice(split), { color: var(--traffic-jam), weight: 6 }).addTo(map));
            } else {
                currentRoutePolylines.push(L.polyline(pts, { color: '#ffffff', weight: 6 }).addTo(map));
            }

            // Detect and add Toll Markers on Map
            activeRouteInstructions.forEach(step => {
                if ((step.intersections || []).some(i => (i.classes || []).includes('toll'))) {
                    const loc = [step.maneuver.location[1], step.maneuver.location[0]];
                    const tIcon = L.divIcon({
                        className: 'toll-marker',
                        html: `<div class="toll-marker-icon">TOL</div>`,
                        iconSize: [36, 24]
                    });
                    tollMarkers.push(L.marker(loc, { icon: tIcon }).addTo(map));
                }
            });

            map.fitBounds(L.latLngBounds(activeRouteCoordinates), { padding: [60, 60] });
            const mins = Math.round(routeData.duration / 60);
            const km = (routeData.distance / 1000).toFixed(1);
            document.getElementById('routeMetrics').innerHTML = `<span><strong>ETA</strong> ${mins} MINS &nbsp; <strong>DIST</strong> ${km} KM</span>`;
            if (activeRouteInstructions.length > 0) updateTurnBanner(activeRouteInstructions[0]);
        }

        function clearPolylines() { currentRoutePolylines.forEach(p => map.removeLayer(p)); currentRoutePolylines = []; }
        function clearTollMarkers() { tollMarkers.forEach(m => map.removeLayer(m)); tollMarkers = []; }

        function updateTurnBanner(step) {
            document.getElementById('turnBanner').classList.add('active');
            document.getElementById('turnInstruction').innerText = (step.maneuver.type + " " + (step.name || '')).toUpperCase();
            document.getElementById('turnDistance').innerText = `NEXT ${Math.round(step.distance)} METERS`;
        }

        function toggleAvoidTolls() {
            avoidTolls = !avoidTolls;
            document.getElementById('tollToggleBtn').classList.toggle('active', avoidTolls);
            showToast(avoidTolls ? "// AVOIDING TOLLS" : "// TOLLS ALLOWED");
            if (activeDestination) calculateRoutes("TARGET");
        }

        function toggleTrafficLayer() {
            showTraffic = !showTraffic;
            document.getElementById('trafficToggleBtn').classList.toggle('active', showTraffic);
            if (routesList.length > 0) renderRouteOnMap(routesList[selectedRouteIndex]);
        }

        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            document.getElementById('voiceToggleBtn').classList.toggle('active', voiceEnabled);
            showToast(voiceEnabled ? "// VOICE ONLINE" : "// VOICE MUTED");
        }

        function toggleNavigation() {
            isNavigating = !isNavigating;
            document.getElementById('startNavBtn').innerText = isNavigating ? 'END' : 'START';
            if (isNavigating) speak("Navigation started.");
            else document.getElementById('turnBanner').classList.remove('active');
        }

        /* AUTO RE-ROUTING (OFF-ROUTE DISTANCE CHECK) */
        function checkOffRoute(coords) {
            if (!isNavigating || activeRouteCoordinates.length === 0) return;
            let minDist = Infinity;
            activeRouteCoordinates.forEach(pt => {
                let d = coords.distanceTo(L.latLng(pt));
                if (d < minDist) minDist = d;
            });
            if (minDist > 35) { // Straying > 35m off path triggers automatic re-routing
                showToast("// OFF ROUTE - RE-ROUTING");
                speak("Off route. Recalculating route.");
                calculateRoutes("TARGET");
            }
        }

        function toggleSimulation() {
            if (isSimulating) {
                clearInterval(simInterval);
                isSimulating = false;
                document.getElementById('simDriveBtn').innerText = 'SIM';
            } else {
                isSimulating = true;
                isNavigating = true;
                document.getElementById('simDriveBtn').innerText = 'HOLD';
                let idx = 0;
                simInterval = setInterval(() => {
                    if (idx >= activeRouteCoordinates.length) {
                        clearInterval(simInterval);
                        speak("Destination reached.");
                        return;
                    }
                    userCoords = L.latLng(activeRouteCoordinates[idx]);
                    updateUserMarker(userCoords);
                    map.panTo(userCoords);
                    idx += 2;
                }, 800);
            }
        }

        function clearActiveRoute() {
            clearPolylines();
            clearTollMarkers();
            if (destMarker) map.removeLayer(destMarker);
            document.getElementById('routeSelectionPanel').classList.remove('active');
            document.getElementById('turnBanner').classList.remove('active');
            document.getElementById('startNavBtn').disabled = true;
            document.getElementById('simDriveBtn').disabled = true;
            document.getElementById('clearBtn').style.display = 'none';
        }
    </script>
</body>
</html>
